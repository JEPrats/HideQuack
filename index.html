<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe2;--pp:#f4efe2;--tx:#3d3b36;--mut:#8b8678;--ln:#dfd8c5;--ne:#e7e0cd;--re:#f0d5cd;--le:#d6e5cf;--ac:#6d6757}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.2rem;border-bottom:1px solid var(--ln)}
#logo{margin:0;font:600 1.25rem Georgia,serif;cursor:pointer;letter-spacing:.01em}
#crumb,#st,#stats{color:var(--mut);font-size:.9rem}.sp{flex:1}
button,.btn{font:inherit;font-size:.9rem;background:transparent;color:var(--ac);border:1px solid var(--ln);border-radius:8px;padding:.4rem .8rem;cursor:pointer}
button:hover,.btn:hover,button.on{background:var(--ne)}
main{max-width:1000px;margin:0 auto;padding:1.2rem}
.bar,.tb{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin-bottom:1.2rem}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem}
.tile{position:relative;background:var(--pp);border:1px solid var(--ln);border-radius:12px;padding:1rem;cursor:pointer;min-height:140px}
.tile:hover{background:var(--ne)}.ic{font-size:1.8rem}.nm{margin-top:.5rem;font-weight:500;word-break:break-word}.mt{color:var(--mut);font-size:.8rem}
.dots{position:absolute;top:.4rem;right:.4rem;border:0;padding:.1rem .5rem;font-size:1.2rem}
.empty{grid-column:1/-1;color:var(--mut);text-align:center;padding:3rem 0}
#dname{font:600 1.1rem Georgia,serif;border:0;background:transparent;color:var(--tx);min-width:0;flex:1 1 200px}
#paper{position:relative;padding:1rem min(4vw,2.5rem) 6rem;min-height:60vh}#paper.pdf{padding:.5rem 0 6rem}
.ed{outline:0;font:1.05rem/1.75 Georgia,"Times New Roman",serif;min-height:55vh}
.ln[data-t=i]{padding-left:0;margin:.5em 0}
.im{position:relative;display:inline-block;max-width:100%;line-height:0;touch-action:auto;user-select:none;-webkit-user-select:none}
#ed.study .im{touch-action:auto}.im img{max-width:100%;height:auto;display:block;border-radius:4px}
.im .x{position:absolute;top:4px;right:4px;display:none;line-height:1;padding:.15rem .5rem;background:var(--pp)}
#ed.drawing .im.armed{cursor:crosshair}#ed.drawing .im.armed img{outline:2px dashed var(--mut)}#ed:not(.study) .im .x{display:block}
.cur{position:absolute;background:rgba(140,130,100,.3);border:1px dashed var(--mut);scroll-margin-bottom:110px}

  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;'
}[c]));

const toast=m=>{
  const t=$('#toast');
  t.textContent=m;
  t.style.opacity=1;
  setTimeout(()=>t.style.opacity=0,2200);
};

function modal(h,fn){
  if(dlg.open)dlg.close();

  dlg.innerHTML=h;

  dlg.onclick=e=>{
    const b=e.target.closest('[data-x]');

    if(e.target===dlg){
      dlg.close();
    }else if(b){
      fn(b.dataset.x);
    }
  };

  dlg.showModal();
}

const idb=()=>new Promise((ok,ko)=>{
  const r=indexedDB.open('sl',1);

  r.onupgradeneeded=()=>{
    r.result.createObjectStore('pdf');
  };

  r.onsuccess=()=>ok(r.result);
  r.onerror=ko;
});

let pdfPut=async(k,b)=>{
  const d=await idb();

  return new Promise(ok=>{
    const t=d.transaction('pdf','readwrite');
    t.objectStore('pdf').put(b,k);
    t.oncomplete=ok;
  });
};

const pdfGet=async k=>{
  const d=await idb();

  return new Promise(ok=>{
    const q=d.transaction('pdf').objectStore('pdf').get(k);
    q.onsuccess=()=>ok(q.result);
  });
};

function ask(title,val,cb){
  modal(
    `<h3>${esc(title)}</h3>
     <input id="ai" value="${esc(val||'')}">
     <button data-x="ok">Aceptar</button>
     <button data-x="no">Cancelar</button>`,
    x=>{
      if(x==='ok'){
        const v=$('#ai').value.trim();

        if(v){
          dlg.close();
          cb(v);
        }
      }else{
        dlg.close();
      }
    }
  );

  const i=$('#ai');
  i.focus();
  i.select();

  i.onkeydown=e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      dlg.querySelector('[data-x=ok]').click();
    }
  };
}

function sure(msg,cb,lab){
  modal(
    `<h3>${esc(msg)}</h3>
     <button data-x="ok">${lab||'Eliminar'}</button>
     <button data-x="no">Cancelar</button>`,
    x=>{
      dlg.close();
      if(x==='ok')cb();
    }
  );
}

const idsIn=h=>[...String(h||'').matchAll(/data-id=(?:"|&quot;)([^"&]+)/g)].map(m=>m[1]);
const subIds=c=>c.pit?idsIn(c.h):(c.img?(c.cur||[]).map(u=>u.id):[]);
const cardIds=i=>i.type==='pdf'
  ?[...Object.keys(i.cards||{}).filter(k=>i.cards[k].r),...Object.values(i.cards||{}).flatMap(subIds)]
  :idsIn(i.html);

function pr(its){
  let t=0,l=0;

  its.forEach(i=>{
    const d=cardIds(i);

    t+=d.length;
    l+=d.filter(k=>((i.cards||{})[k]||{}).s==='l').length;
  });

  return t?'✓ '+l+'/'+t:'Sin tarjetas';
}

const progI=i=>pr([i]);
const progF=id=>pr(vi().filter(i=>i.folder===id));

  doc=null;

  $('#pages').innerHTML='';
  $('#home').hidden=false;$('#fview').hidden=true;
  $('#docv').hidden=true;

  if(!f)cur=null;

  $('#crumb').textContent=f?'/ '+f.name:'';
  $('#crumb').className='';

  let h='';

  if(!cur){
    vf().forEach(x=>{
      h+=tile(

        ICO.f,
        x.name,
        progF(x.id)
      );
    });
  }

    .filter(i=>(i.folder||null)===cur)
    .forEach(i=>{

        'i',
        i.id,
        i.type==='pdf'?ICO.p:ICO.d,
        i.name,
        progI(i)
      );
    });

}

function menu(k,id,r){
  closeMenu();

  const m=document.createElement('div');
  m.id='menu';

  m.innerHTML=
    '<button data-a="ren">Renombrar</button>'+
    (k==='i'?'<button data-a="mov">Mover</button><button data-a="shr">Compartir…</button>':'<button data-a="map">Ver mapa</button>')+
    '<button data-a="rst">Reiniciar progreso</button>'+
    '<button data-a="del">Eliminar</button>';

  m.style.top=r.bottom+4+'px';
  m.style.left=Math.max(
    4,
    Math.min(r.left-80,innerWidth-150)
  )+'px';

  document.body.append(m);

  m.onclick=e=>{
    const a=e.target.dataset.a;

    if(!a)return;

    closeMenu();

    const x=(k==='f'?S.folders:S.items)
      .find(y=>y.id===id);

    if(!x)return;

    if(a==='ren'){
      ask('Nuevo nombre',x.name,n=>{
        x.name=n;
        x.updated=Date.now();
        persist();
        home();
      });
    }

    if(a==='mov'){ mover(x); } if(a==='shr'){ shareModal(x); } if(a==='map'){ folderMap(id); }

    if(a==='rst'){
      sure(
        '¿Reiniciar el progreso de "'+x.name+'"?',
        ()=>{
          (k==='f'
            ?vi().filter(i=>i.folder===id)
            :[x]
          ).forEach(resetItem);

          persist();
          home();
        },
        'Reiniciar'
      );
    }

    if(a==='del'){
      sure(
        '¿Eliminar "'+x.name+'"?'+
        (k==='f'
          ?' Sus documentos pasarán al escritorio.'
          :''),
        ()=>{
          if(k==='f'){
            S.items.forEach(i=>{
              if(i.folder===id){
                i.folder=null;
                i.updated=Date.now();
              }
            });
          }

          x.del=true;
          x.updated=Date.now();

          persist();
          home();
        }
      );
    }
  };
}

function mover(i){
  modal(

const txt=L=>L.textContent.replace(/\u200b/g,'');

const isEmpty=L=>
  !txt(L)&&!L.querySelector('.card');

function setL(L,t,l){
  L.dataset.t=t;
  L.dataset.l=l;
  L.style.setProperty('--l',l);
}

function mk(t,l,h){
  const d=document.createElement('div');

  d.className='ln';
  setL(d,t,l);
  d.innerHTML=h||'<br>';

  return d;
}

function put(el,end){
  const r=document.createRange();

  r.selectNodeContents(el);
  r.collapse(!end);

  const s=getSelection();

  s.removeAllRanges();
  s.addRange(r);
}

function curLine(){
  const s=getSelection();

  if(!s.rangeCount)return null;

  let n=s.anchorNode;

  while(
    n &&
    n!==ed &&
    !(n.nodeType===1&&n.classList.contains('ln'))
  ){
    n=n.parentNode;
  }

  return n&&n!==ed?n:null;
}

function boundary(L,r,end){
  const q=document.createRange();

  q.selectNodeContents(L);

  end
    ?q.setStart(r.endContainer,r.endOffset)
    :q.setEnd(r.startContainer,r.startOffset);

  return q.toString().replace(/\u200b/g,'')==='';
}

function norm(){
  [...ed.childNodes].forEach(n=>{
    if(
      n.nodeType===1 &&
      n.classList.contains('ln')
    )return;

    if(
      n.nodeType===1 &&
      n.tagName!=='BR'
    ){
      n.className='ln';

      if(!n.dataset.t){
        setL(n,'b',0);
      }
    }else{
      const L=mk('b',0,'');

      n.replaceWith(L);

      if(n.nodeName==='BR'){
        L.innerHTML='<br>';
      }else{
        L.innerHTML='';
        L.append(n);
      }
    }
  });

  if(!ed.firstChild){
    ed.append(mk('b',0,''));
  }
}

function ser(){
  const c=ed.cloneNode(true);c.querySelectorAll('.rh').forEach(h=>h.remove());c.querySelectorAll('.im').forEach(i=>i.classList.remove('sel','armed'));

  c.querySelectorAll('.card,.cur').forEach(x=>{
    const k=x.classList.contains('cur')
      ?'cur'
      :'card';

    x.className=k;
    x.removeAttribute('data-s');
  });

  return c.innerHTML;
}

function flush(){
  clearTimeout(st);

  if(
    !doc ||
    doc.type==='pdf' ||
    $('#docv').hidden
  )return;
  dirty=false;
  doc.html=ser();
  doc.updated=Date.now();

  persist();
}

const save=()=>{
  dirty=true;
  clearTimeout(st);
  st=setTimeout(flush,400);
};

function join(p,L){
  if(
    p.lastChild &&
    p.lastChild.nodeName==='BR'
  ){
    p.lastChild.remove();
  }

  const pos=p.childNodes.length;

  while(L.firstChild){
    p.append(L.firstChild);
  }

  L.remove();

  if(!p.firstChild){
    p.innerHTML='<br>';
  }

  const r=document.createRange();

  r.setStart(
    p,
    Math.min(pos,p.childNodes.length)
  );

  r.collapse(true);

  const s=getSelection();

  s.removeAllRanges();
  s.addRange(r);
}

ed.addEventListener('keydown',e=>{
  if(
    mode!=='edit' ||
    ed.contentEditable==='false'
  )return;

  if(
    (e.ctrlKey||e.metaKey) &&
    'biu'.includes(e.key.toLowerCase())
  ){
    e.preventDefault();
    return;
  }

  norm();

  const L=curLine();

  if(!L)return;

  const s=getSelection();
  const r=s.getRangeAt(0);
  const t=L.dataset.t;
  const l=+L.dataset.l;

  if(t==='i'){
    if(
      !e.ctrlKey &&
      !e.metaKey &&
      (
        e.key.length===1 ||
        ['Enter','Backspace','Delete','Tab'].includes(e.key)
      )
    ){
      e.preventDefault();
    }

    return;
  }

  if(e.key==='Enter'){
    e.preventDefault();

    if(!r.collapsed){
      r.deleteContents();
    }

    if(
      t==='b' &&
      isEmpty(L)
    ){
      l>0
        ?setL(L,'b',l-1)
        :setL(L,'e',0);

      return save();
    }

    const q=document.createRange();

    q.setStart(r.endContainer,r.endOffset);
    q.setEnd(L,L.childNodes.length); const f=q.extractContents(); f.querySelectorAll('.pit').forEach(p=>L.append(p));

    f.querySelectorAll('.card').forEach(c=>{
      if(!c.textContent.replace(/\u200b/g,'')){
        c.remove();
      }else{
        c.dataset.id=uid();
      }
    });

    const N=mk(
      t==='h'?'b':t,
      t==='h'?0:l,
      ''
    );

    N.innerHTML='';
    N.append(f);

    if(isEmpty(N)){
      N.innerHTML='<br>';
    }

    if(!L.firstChild||isEmpty(L)){
      L.innerHTML='<br>';
    }

    L.after(N);
    put(N);

    return save();
  }

  if(e.key==='Tab'){
    e.preventDefault();

    if(t==='h'||t==='p')return;

    let tt=t;
    let ll=l;

    if(t==='e'){
      tt='b';
      ll=0;
    }

    ll=e.shiftKey
      ?Math.max(0,ll-1)
      :Math.min(6,ll+1);

    setL(L,tt,ll);

    return save();
  }

  const cd=(
    r.startContainer.nodeType===1
      ?r.startContainer
      :r.startContainer.parentElement
  ).closest('.card');

  const cm=(
    r.startContainer.nodeType===1
      ?r.startContainer
      :r.startContainer.parentElement
  ).closest('.cm');

  if(
    e.key==='Backspace' &&
    r.collapsed &&
    cm &&
    !cm.textContent.replace(/\u200b/g,'')
  ){
    e.preventDefault();

    const cc=cm.parentElement;

    cm.remove();

    const q=document.createRange();

    q.selectNodeContents(cc);
    q.collapse(false);

    s.removeAllRanges();
    s.addRange(q);

    return save();
  }

  if(
    e.key==='Backspace' &&
    r.collapsed &&
    cd &&
    !cd.textContent.replace(/\u200b/g,'')
  ){
    e.preventDefault();

    const pv=cd.previousSibling;

    cd.remove();

    if(!L.firstChild){
      L.innerHTML='<br>';
    }

    if(pv&&pv.nodeType===3){
      const q=document.createRange();

      q.setStart(pv,pv.length);
      q.collapse(true);

      s.removeAllRanges();
      s.addRange(q);
    }else{
      put(L);
    }

    return save();
  }

  if(
    e.key==='Backspace' &&
    r.collapsed &&
    boundary(L,r,false)
  ){
    const p=L.previousElementSibling;
    const em=isEmpty(L);

    e.preventDefault();

    if(t==='b'&&l>0){
      setL(L,'b',l-1);
      return save();
    }

    if(t==='h'&&!em){
      setL(L,'b',0);
      return save();
    }

    if(em){
      if(
        p &&
        p.dataset.t!=='i'
      ){
        L.remove();
        put(p,true);
      }else if(
        !p &&
        t!=='e'
      ){
        setL(L,'e',0);
      }

      return save();
    }

    if(!p||p.dataset.t==='i')return;

    if(p.dataset.t==='e'){
      p.remove();
      return save();
    }

    join(p,L);
    return save();
  }

  if(
    e.key==='Delete' &&
    r.collapsed &&
    boundary(L,r,true)
  ){
    e.preventDefault();

    const n=L.nextElementSibling;

    if(!n||n.dataset.t==='i')return;

    if(isEmpty(n)){
      n.remove();
    }else if(isEmpty(L)){
      L.remove();
      put(n);
    }else{
      join(L,n);
    }

    return save();
  }
});

// Convierte  "texto <oculto<"  en tarjeta cuando se escribe el SEGUNDO "<".
// Devuelve true si modificó el DOM. El primer "<" nunca toca el DOM.
function tryCard(){
  const s=getSelection();
  if(!s.rangeCount||!s.isCollapsed)return false;
  let n=s.anchorNode,o=s.anchorOffset;
  if(!n||!(ed.contains(n)||$('#pbody').contains(n)))return false;
  if(n.nodeType===1){ // cursor en un elemento: usar el nodo de texto contiguo
    const a=n.childNodes[o-1],b=n.childNodes[o];
    if(a&&a.nodeType===3){n=a;o=a.data.length}
    else if(b&&b.nodeType===3){n=b;o=0}
    else return false;
  }
  if(n.nodeType!==3||!n.parentElement)return false;
  if(n.parentElement.closest('.card,.cm,.cur,.im')||!(n.parentElement.closest('.ln')||n.parentElement.closest('#pbody')))return false;
  let merged=false;
  while(n.previousSibling&&n.previousSibling.nodeType===3){ // texto partido por el navegador
    const p=n.previousSibling;o+=p.data.length;n.data=p.data+n.data;p.remove();merged=true;
  }
  if(merged){const r=document.createRange();r.setStart(n,o);r.collapse(true);s.removeAllRanges();s.addRange(r)}
  if(o<2||n.data[o-1]!=='<')return false;
  const start=n.data.lastIndexOf('<',o-2);
  if(start<0)return false;
  const m=n.data.slice(start+1,o-1).replace(/\u200b/g,'').match(/^(\s*)([\s\S]*?)(\s*)$/);
  if(!m[2])return false;
  const before=n.data.slice(0,start)+m[1];
  const sp=document.createElement('span');
  sp.className='card';sp.dataset.id=uid();sp.textContent=m[2];
  const tail=document.createTextNode('\u200b'+m[3]+n.data.slice(o));
  if(before){n.data=before;n.after(sp,tail)}else n.replaceWith(sp,tail);
  const r=document.createRange();r.setStart(tail,1);r.collapse(true);
  s.removeAllRanges();s.addRange(r);
  return true;
}
ed.addEventListener('compositionend',()=>{if(tryCard()){paint();save()}});
ed.addEventListener('input',(e)=>{
  norm();

  ed.querySelectorAll('.card,.cm').forEach(c=>{
    if(
      !c.textContent.replace(/\u200b/g,'') &&
      !c.contains(getSelection().anchorNode)
    ){
      c.remove();
    }
  });

  const L=curLine();

  if(!L)return save();

  if(
    L.dataset.t==='e' &&
    txt(L)
  ){
    setL(L,'b',0);
  }

  const s=getSelection();
  const n=s.anchorNode;
  const o=s.anchorOffset;

  // ----------------------------------------------------------
  // OCULTACIÓN AUTOMÁTICA:  Texto <oculto< texto
  // ----------------------------------------------------------
  if(!(e&&e.isComposing)&&tryCard()){
    paint();
    return save();
  }
  // ----------------------------------------------------------
  // COMENTARIO DE TARJETA
  // ++
  // ----------------------------------------------------------

  if(
    n &&
    n.nodeType===3 &&
    o>=2 &&
    n.data.slice(o-2,o)==='++'
  ){
    const cd=n.parentElement.closest('.card');

    if(
      cd &&
      !cd.querySelector('.cm')
    ){
      n.data=n.data.slice(0,o-2)+n.data.slice(o);

      const cm=document.createElement('span');

      cm.className='cm';
      cm.textContent='\u200b';

      cd.append(cm);

      const r=document.createRange();

      r.setStart(cm.firstChild,1);
      r.collapse(true);

      s.removeAllRanges();
      s.addRange(r);
    }
  }

  save();
});

document.addEventListener('keydown',e=>{
  const less=
    e.key==='<' ||
    e.code==='IntlBackslash' ||
    (e.code==='Comma'&&e.shiftKey);

  if(

function hideSel(){const s=getSelection();if(s.rangeCount&&$('#pbody').contains(s.getRangeAt(0).commonAncestorContainer))return hideSelPit();doc.type==='pdf'?hideSelPdf():hideSelText()}

function hideSelText(){
  const s=getSelection();

  if(
    !s.rangeCount ||
    s.isCollapsed
  ){
    return toast('Selecciona primero un texto');
  }

  const r=s.getRangeAt(0);

  if(
    !ed.contains(r.commonAncestorContainer)
  ){
    return toast('Selecciona texto dentro del documento');
  }

  let n=0;

  ed.querySelectorAll('.ln').forEach(L=>{
    if(!r.intersectsNode(L))return;

    const q=document.createRange();

    q.selectNodeContents(L);

    if(
      r.compareBoundaryPoints(
        Range.START_TO_START,
        q
      )>0
    ){
      q.setStart(
        r.startContainer,
        r.startOffset
      );
    }

    if(
      r.compareBoundaryPoints(
        Range.END_TO_END,
        q
      )<0
    ){
      q.setEnd(
        r.endContainer,
        r.endOffset
      );
    }

    if(
      q.toString()
       .replace(/\u200b/g,'')
       .trim()===''
    )return;

    const a=q.commonAncestorContainer;

    if(
      (a.nodeType===1?a:a.parentElement)
      .closest('.card')
    )return;

    const f=q.extractContents();

    f.querySelectorAll('.card').forEach(c=>{
      c.replaceWith(...c.childNodes);
    });

    const sp=document.createElement('span');

    sp.className='card';
    sp.dataset.id=uid();
    sp.append(f);

    q.insertNode(sp);

    n++;
  });

  s.removeAllRanges();

  if(n){
    paint();
    flush();

    toast(
      n>1
        ?n+' tarjetas creadas'
        :'Tarjeta creada'
    );
  }
}

const PDFW=
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfW=0;

async function getBlob(id){
  let b=await pdfGet(id);

  if(
    !b &&
    sb &&
    user
  ){
    const {data}=await sb.storage
      .from('pdfs')
      .download(`${user.id}/${id}.pdf`);

    if(data){
      b=data;
      await pdfPut(id,b);
    }
  }

  return b;
}

async function loadPdf(){
  const host=$('#pages');
  const d=doc;

  host.innerHTML=
    '<p class="empty">Cargando PDF…</p>';

  if(!window.pdfjsLib){
    host.innerHTML=
      '<p class="empty">No se pudo cargar pdf.js (¿sin conexión?).</p>';
    return;
  }

  const b=await getBlob(d.id);

  if(!b){
    host.innerHTML=
      '<p class="empty">El PDF original no está disponible en este dispositivo.</p>';
    return;
  }

  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;

  let pdf;

  try{
    pdf=await pdfjsLib
      .getDocument({
        data:await b.arrayBuffer()
      })
      .promise;
  }catch(e){
    host.innerHTML=
      '<p class="empty">No se pudo abrir el PDF.</p>';
    return;
  }

  if(doc!==d)return;

  const w=
    pdfW=
      host.clientWidth||800;

  host.innerHTML='';

  const io=new IntersectionObserver(
    es=>es.forEach(en=>{
      if(
        en.isIntersecting &&
        !en.target.dataset.done
      ){
        en.target.dataset.done=1;
        drawPage(en.target);
      }
    }),
    {
      rootMargin:'900px'
    }
  );

  for(
    let p=1;
    p<=pdf.numPages;
    p++
  ){
    const page=await pdf.getPage(p);

    const vp=page.getViewport({
      scale:
        w/
        page.getViewport({scale:1}).width
    });

    if(doc!==d)return;

    const pg=document.createElement('div');

    pg.className='pg';
    pg.dataset.p=p;
    pg.style.width=vp.width+'px';
    pg.style.height=vp.height+'px';

    pg._page=page;
    pg._vp=vp;

    pg.innerHTML='<div class="ov"></div>';

    host.append(pg);
    io.observe(pg);
  }

  renderOv();
  paint();
}

async function drawPage(pg){
  const page=pg._page;
  const vp=pg._vp;

  const dpr=Math.min(
    devicePixelRatio||1,
    2
  );

  const c=document.createElement('canvas');

  c.width=vp.width*dpr;
  c.height=vp.height*dpr;

  c.style.cssText=
    'position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply';

  pg.prepend(c);

  await page.render({
    canvasContext:c.getContext('2d'),
    viewport:vp,
    transform:
      dpr!==1
        ?[dpr,0,0,dpr,0,0]
        :null
  }).promise;

  const tl=document.createElement('div');

  tl.className='textLayer';
  tl.style.setProperty(
    '--scale-factor',
    vp.scale
  );

  pg.insertBefore(
    tl,
    pg.querySelector('.ov')
  );

  finishTextLayer(tl,pdfjsLib.renderTextLayer({
    textContentSource:
      await page.getTextContent(),
    container:tl,
    viewport:vp,
    textDivs:[]
  }));
}
// Evita que la selección "salte" hacia arriba o abajo al pasar el ratón por huecos de la capa de texto:
// una capa final (endOfContent) ocupa todo el hueco mientras se arrastra, como hace el visor de pdf.js.
function finishTextLayer(tl,task){
  tl.addEventListener('mousedown',()=>tl.classList.add('selecting'));
  const done=()=>{const e=document.createElement('div');e.className='endOfContent';tl.append(e)};
  return task&&task.promise?task.promise.then(done,done):done();
}
document.addEventListener('mouseup',()=>document.querySelectorAll('.textLayer.selecting').forEach(t=>t.classList.remove('selecting')));

function mergeRects(a){
  a.sort(
    (m,n)=>
      m.p-n.p||
      m.y-n.y||
      m.x-n.x
  );

  const o=[];

  a.forEach(r=>{
    const l=o[o.length-1];

    if(
      l &&
      l.p===r.p &&
      Math.abs(
        l.y+l.h/2-
        (r.y+r.h/2)
      )<
        Math.max(l.h,r.h)*.5 &&
      r.x<=l.x+l.w+.03
    ){
      const x2=Math.max(
        l.x+l.w,
        r.x+r.w
      );

      const y1=Math.min(
        l.y,
        r.y
      );

      const y2=Math.max(
        l.y+l.h,
        r.y+r.h
      );

      l.x=Math.min(l.x,r.x);
      l.w=x2-l.x;
      l.y=y1;
      l.h=y2-y1;
    }else{
      o.push({...r});
    }
  });

  return o;
}

function hideSelPdf(){
  const s=getSelection();

  if(
    !s.rangeCount ||
    s.isCollapsed
  ){
    return toast('Selecciona primero un texto');
  }

  const r=s.getRangeAt(0);
  const rects=[];
  let text='';

  $('#pages')
    .querySelectorAll('.pg')
    .forEach(pg=>{
      const tl=pg.querySelector('.textLayer');

      if(
        !tl ||
        !r.intersectsNode(tl)
      )return;

      const pr=pg.getBoundingClientRect();

      tl.querySelectorAll('span')
        .forEach(sp=>{
          if(!r.intersectsNode(sp))return;

          const q=document.createRange();

          q.selectNodeContents(sp);

          if(
            r.compareBoundaryPoints(
              Range.START_TO_START,
              q
            )>0
          ){
            q.setStart(
              r.startContainer,
              r.startOffset
            );
          }

          if(
            r.compareBoundaryPoints(
              Range.END_TO_END,
              q
            )<0
          ){
            q.setEnd(
              r.endContainer,
              r.endOffset
            );
          }

          const t=q.toString();

          if(!t.trim())return;

          text+=t+' ';

          for(
            const b of q.getClientRects()
          ){
            if(b.width>1){
              rects.push({
                p:+pg.dataset.p,
                x:(b.left-pr.left)/pr.width,
                y:(b.top-pr.top)/pr.height,
                w:b.width/pr.width,
                h:b.height/pr.height
              });
            }
          }
        });
    });

  if(!rects.length){
    return toast('Selecciona texto del PDF');
  }

  doc.cards[uid()]={
    r:mergeRects(rects),
    t:text.trim().slice(0,200)
  };

  doc.updated=Date.now();

  persist();

  s.removeAllRanges();

  renderOv();
  paint();

  toast('Tarjeta creada');
}

function renderOv(){
  const host=$('#pages');
  host.querySelectorAll('.pc,.pi,.hb,.pim').forEach(e=>e.remove());
  Object.entries(doc.cards).forEach(([id,c])=>{
    if(c.img){drawPim(host,id,c);return} if(c.pit||c.hd){ // posit o encabezado marcado en el PDF
      const pg=host.querySelector(`.pg[data-p="${c.p}"]`);
      if(!pg)return;
      const d=document.createElement('div');
      d.dataset.id=id;d.className=c.pit?'pi':'hb';
      if(c.hd)d.textContent=c.hd;
      d.style.cssText=c.pit?`top:${(c.y*100).toFixed(3)}%`:`left:${(c.x*100).toFixed(3)}%;top:${(c.y*100).toFixed(3)}%`;
      pg.append(d);return;
    }
    (c.r||[]).forEach(r=>{
      const ov=host.querySelector(`.pg[data-p="${r.p}"] .ov`);
      if(!ov)return;
      const d=document.createElement('div');
      d.className='pc';d.dataset.id=id;
      d.style.cssText=`left:${(r.x*100-.15).toFixed(3)}%;top:${(r.y*100-.1).toFixed(3)}%;width:${(r.w*100+.3).toFixed(3)}%;height:${(r.h*100+.2).toFixed(3)}%`;
      ov.append(d);
    });
  });
}

function addImage(f){ if(doc&&doc.type==='pdf')return addPdfImage(f);
  if(
    !f ||
    !f.type.startsWith('image/')
  ){
    return toast('Archivo no válido');
  }

  const u=URL.createObjectURL(f);
  const im=new Image();

  im.onload=()=>{
    const k=Math.min(
      1,
      1100/im.width
    );

    const c=document.createElement('canvas');

    c.width=Math.round(im.width*k);
    c.height=Math.round(im.height*k);

    const x=c.getContext('2d');

    x.fillStyle='#fff';
    x.fillRect(
      0,
      0,
      c.width,
      c.height
    );

    x.drawImage(
      im,
      0,
      0,
      c.width,
      c.height
    );

    URL.revokeObjectURL(u);

    const L=document.createElement('div');

    L.className='ln';
    setL(L,'i',0);
    L.contentEditable='false';

    L.innerHTML=
      '<div class="im">'+
      '<img draggable="false" alt="" src="'+
      c.toDataURL('image/jpeg',.82)+
      '">'+
      '<button class="x" title="Quitar imagen">×</button>'+
      '</div>';

    let ref=curLine();

    if(!ref){
      ref=ed.lastElementChild;
    }

    if(
      ref &&
      ref.dataset.t==='e' &&
      isEmpty(ref)
    ){
      ref.replaceWith(L);
    }else if(ref){
      ref.after(L);
    }else{
      ed.append(L);
    }

    const N=mk('e',0);

    L.after(N);

    put(N);

    flush();

    toast('Imagen añadida');
  };

  im.onerror=()=>{
    toast('No se pudo leer la imagen');
  };

  im.src=u;
}

function endDrag(){
  clearTimeout(lp);
  if(!drag)return;
  const d=drag;drag=null;$('#dropi').hidden=true;
  if(d.t==='resize'){flush();return}
  if(d.t==='curtain'){
    if(d.el){
      if(parseFloat(d.el.style.width)<2||parseFloat(d.el.style.height)<2)d.el.remove();
      else{paint();flush()}
      disarm();                                  // una cortina cada vez
    }
    return;
  }
  if(d.t==='move'&&d.moved){
    const L=imLine(d.im);
    ed.insertBefore(L,d.tb);                     // tb===null -> al final
    if(d.al==='l')L.removeAttribute('data-al');else L.dataset.al=d.al;
    if(!L.nextElementSibling)ed.append(mk('e',0));
    flush();
  }
}

let sb=null;
let user=null;
let syncing=false;   // generación de sesión que está sincronizando (false = libre)
let pending=false;   // hay que repetir la sincronización al terminar la actual
let gen=0;           // se incrementa en cada cambio de sesión
let tm;

if(
  CFG.url &&
  CFG.key &&
  window.supabase
){
  sb=supabase.createClient(
    CFG.url,
    CFG.key
  );

  sb.auth.onAuthStateChange(
    (_e,s)=>{
      const next=s?.user||null;
      const changed=(user?.id||null)!==(next?.id||null);

      if(!changed){
        // mismo usuario (refresco de token, etc.): no reiniciar nada
        user=next;
        $('#acct').textContent=user?user.email:'Entrar';
        return;
      }

      // 1) Guardar el estado de la cuenta saliente bajo SU clave
      if(user){
        if(doc)flush();
        localStorage.setItem('sl1_'+user.id,JSON.stringify(S));
      }

      // 2) Invalidar sincronizaciones y temporizadores de la sesión anterior
      gen++;
      pending=false;
      clearTimeout(tm);
      clearTimeout(st);
      dirty=false;

      user=next;
      cur=null;
      doc=null;
      mode='edit';
      active=null;
      ed.innerHTML='';
      hideBar();
      $('#st').textContent='';

      if(user){
        const key='sl1_'+user.id;
        let saved=localStorage.getItem(key);

        // Recuperar datos antiguos una sola vez POR CUENTA
        if(localStorage.getItem('sl1_legacy_claimed')!==user.id){
          const legacy=localStorage.getItem('sl1');
          if(legacy){
            try{
              const old=JSON.parse(legacy);
              const current=saved?JSON.parse(saved):{folders:[],items:[]};
              old.folders||=[];old.items||=[];
              current.folders||=[];current.items||=[];
              old.folders.forEach(x=>{
                if(!current.folders.some(y=>y.id===x.id))current.folders.push(x);
              });
              old.items.forEach(x=>{
                if(!current.items.some(y=>y.id===x.id))current.items.push(x);
              });
              saved=JSON.stringify(current);
              localStorage.setItem(key,saved);
              localStorage.setItem('sl1_legacy_claimed',user.id);
            }catch(e){
              console.error('No se pudieron recuperar los datos antiguos:',e);
            }
          }
        }

        let loaded=null;
        try{loaded=saved?JSON.parse(saved):null}catch(e){console.error(e)}
        S=loaded||{folders:[],items:[]};
        S.folders||=[];
        S.items||=[];
        stateOwner=user.id;

        $('#acct').textContent=user.email;
        home();               // 1º pintar el estado local de la cuenta
        setTimeout(sync,0);   // 2º fusionar con Supabase
      }else{
        S={folders:[],items:[]};
        stateOwner=null;
        $('#acct').textContent='Entrar';
        home();
      }
    }
  );
}

// Selección dentro del PDF -> rectángulos relativos a cada página
function pdfSelection(){
  const s=getSelection();
  if(!s.rangeCount||s.isCollapsed)return null;
  const r=s.getRangeAt(0),rects=[];let text='';
  $('#pages').querySelectorAll('.pg').forEach(pg=>{
    const tl=pg.querySelector('.textLayer');
    if(!tl||!r.intersectsNode(tl))return;
    const pr=pg.getBoundingClientRect();
    tl.querySelectorAll('span').forEach(sp=>{
      if(!r.intersectsNode(sp))return;
      const q=document.createRange();q.selectNodeContents(sp);
      if(r.compareBoundaryPoints(Range.START_TO_START,q)>0)q.setStart(r.startContainer,r.startOffset);
      if(r.compareBoundaryPoints(Range.END_TO_END,q)<0)q.setEnd(r.endContainer,r.endOffset);
      const t=q.toString();if(!t.trim())return;text+=t+' ';
      for(const b of q.getClientRects())if(b.width>1)rects.push({p:+pg.dataset.p,x:(b.left-pr.left)/pr.width,y:(b.top-pr.top)/pr.height,w:b.width/pr.width,h:b.height/pr.height});
    });
  });
  if(!rects.length)return null;
  rects.sort((a,b)=>a.p-b.p||a.y-b.y||a.x-b.x);
  return {rects,text:text.trim().slice(0,150)};
}

function headText(n){
  const s=getSelection();
  if(!s.rangeCount||!ed.contains(s.anchorNode))return;
  const r=s.getRangeAt(0);
  let ls=[...ed.querySelectorAll('.ln')].filter(L=>{
    if(L.dataset.t==='i'||!r.intersectsNode(L))return false;
    if(r.collapsed)return true;
    if(L.contains(r.endContainer)&&!L.contains(r.startContainer)){
      const q=document.createRange();q.selectNodeContents(L);q.setEnd(r.endContainer,r.endOffset);
      if(q.toString()==='')return false; // la selección termina justo al inicio de esta línea
    }
    return true;
  });
  if(!ls.length)return;
  const same=ls.every(L=>L.dataset.t==='h'&&+L.dataset.l===n);
  ls.forEach(L=>same?setL(L,'b',0):setL(L,'h',n));
  save();
}

function imgData(file,max){
  return new Promise((ok,ko)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const k=Math.min(1,max/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.82))};
    im.onerror=()=>ko();im.src=u;
  });
}
async function addPitImage(f){
  if(!f||!f.type.startsWith('image/')||!pitEl||mode!=='edit')return;

  const img=document.createElement('img');img.className='pimg';img.alt='';img.draggable=false;img.src=src;
  const pb=$('#pbody'),s=getSelection();
  if(s.rangeCount&&pb.contains(s.anchorNode)){const r=s.getRangeAt(0);r.collapse(false);r.insertNode(img)}else pb.append(img);
  img.after(document.createTextNode('\n'));

}

}

let lastPT='mouse',lastMouse={x:0,y:0};
const hideSm=()=>{$('#sm').hidden=true;$('#smn').hidden=true;$('#smnb').hidden=true;smR=null};
function showSm(x,y,range){
  const inPit=$('#pbody').contains(range.commonAncestorContainer);
  const pdf=doc.type==='pdf'&&!inPit,sel=!range.collapsed,m=$('#sm');
  smR=range.cloneRange();

  m.querySelector('[data-a=pit]').hidden=inPit||(pdf&&!sel);
  $('#smH').hidden=inPit||(pdf&&!sel);
  m.querySelector('[data-a=cur]').hidden=!pdf;                 // cortinas sobre las imágenes del PDF
  const sp=m.querySelector('[data-a=split]');sp.hidden=inPit;sp.textContent=doc.type==='pdf'?'Dividir PDF…':'Dividir documento aquí';
  $('#smnb [data-b=copy]').hidden=!sel;

  m.style.left=Math.max(6,Math.min(x,innerWidth-190))+'px';

function updSm(){ // táctil: al seleccionar texto
  if(lastPT==='mouse')return;           // con ratón el menú sale solo con clic derecho
  if(!doc||mode!=='edit'||view==='map'||dlg.open||pdn)return hideSm();

  if(!host.contains(r.commonAncestorContainer)&&!$('#pbody').contains(r.commonAncestorContainer))return hideSm();

function rangeAt(x,y){
  if(document.caretRangeFromPoint)return document.caretRangeFromPoint(x,y);
  if(document.caretPositionFromPoint){
    const p=document.caretPositionFromPoint(x,y);
    if(p){const r=document.createRange();r.setStart(p.offsetNode,p.offset);r.collapse(true);return r}
  }
  return null;
}
document.addEventListener('contextmenu',e=>{

// ---- Básicos: copiar, pegar, seleccionar todo ----
function insertAtCaret(t){
  if(document.execCommand&&document.execCommand('insertText',false,t))return;
  const s=getSelection();if(!s.rangeCount)return;
  const r=s.getRangeAt(0);r.deleteContents();
  const n=document.createTextNode(t);r.insertNode(n);r.setStartAfter(n);r.collapse(true);
  s.removeAllRanges();s.addRange(r);
}
function pasteText(text){
  const ls=text.replace(/\r/g,'').split('\n');
  insertAtCaret(ls[0]);
  let L=curLine();
  if(!L)return;
  ls.slice(1).forEach(x=>{const N=mk(x?'b':'e',0,x?esc(x):'');L.after(N);L=N});
  put(L,true);save();
}
async function basic(k,r){
  const inPit=!!(r&&$('#pbody').contains(r.commonAncestorContainer));
  const pdf=doc&&doc.type==='pdf'&&!inPit,host=inPit?$('#pbody'):(pdf?$('#pages'):ed);
  const restore=()=>{if(!r)return;if(!pdf)host.focus({preventScroll:true});const s=getSelection();s.removeAllRanges();s.addRange(r)};
  if(k==='copy'){
    const t=getSelection().toString().replace(/\u200b/g,'');
    if(!t)return;
    try{await navigator.clipboard.writeText(t)}catch(_){try{document.execCommand('copy')}catch(__){}}
    toast('Copiado');
  }else if(k==='all'){
    const rg=document.createRange();rg.selectNodeContents(host);
    const s=getSelection();s.removeAllRanges();s.addRange(rg);
  }else if(k==='paste'){
    if(pdf||mode!=='edit')return;
    let t=null;
    try{
      if(navigator.clipboard.read){
        for(const it of await navigator.clipboard.read()){
          const ty=it.types.find(x=>x.startsWith('image/'));
          if(ty){restore();const blob=await it.getType(ty);inPit?addPitImage(blob):addImage(blob);return}
          if(t==null&&it.types.includes('text/plain'))t=await(await it.getType('text/plain')).text();
        }
      }
    }catch(_){}
    if(t==null){try{t=await navigator.clipboard.readText()}catch(_){return toast('El navegador no permite pegar desde aquí: usa Ctrl+V')}}
    if(t){restore();if(inPit){insertAtCaret(t);syncPit();paint();placePit()}else pasteText(t)}
  }
}
// Básicos del menú de imágenes
async function imBasic(k,im){
  if(k==='copy'){
    try{
      const img=im.querySelector('img'),c=document.createElement('canvas');
      c.width=img.naturalWidth||img.width;c.height=img.naturalHeight||img.height;
      c.getContext('2d').drawImage(img,0,0);
      const blob=await new Promise(r=>c.toBlob(r,'image/png'));
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      toast('Imagen copiada');
    }catch(_){toast('Este navegador no permite copiar la imagen')}
  }else if(k==='paste'){
    let L=imLine(im).nextElementSibling;
    while(L&&L.dataset.t==='i')L=L.nextElementSibling;
    if(!L){L=mk('e',0);ed.append(L)}
    put(L);
    basic('paste',getSelection().getRangeAt(0));
  }else if(k==='all')basic('all',null);
}

// ---- Desplazamiento y zoom: dedos (móvil/tablet), ratón, rueda, WASD y + / − ----
function pz(vp,inn){
  const st={x:24,y:24,k:1},P=new Map();
  let moved=false,pd=0,pm=null;
  const ap=()=>{inn.style.transform=`translate(${st.x}px,${st.y}px) scale(${st.k})`};
  st.reset=()=>{st.x=24;st.y=24;st.k=1;ap()};
  st.fit=(W,H)=>{ // encaja todo el mapa en la pantalla al abrirlo
    const w=vp.clientWidth,h=vp.clientHeight;
    if(!w||!h||!W)return st.reset();
    const k=Math.max(.35,Math.min(1,(w-48)/W,(h-48)/H));
    st.k=k;st.x=Math.max(24,(w-W*k)/2);st.y=Math.max(24,(h-H*k)/2);ap();
  };
  st.pan=(dx,dy)=>{st.x+=dx;st.y+=dy;ap()};
  st.zoom=(f,cx,cy)=>{
    const k=Math.max(.2,Math.min(3,st.k*f));
    if(cx==null){cx=vp.clientWidth/2;cy=vp.clientHeight/2}
    st.x=cx-(cx-st.x)*(k/st.k);st.y=cy-(cy-st.y)*(k/st.k);st.k=k;ap();
  };
  vp.addEventListener('click',e=>{if(moved){e.stopImmediatePropagation();e.preventDefault();moved=false}},true);
  vp.addEventListener('pointerdown',e=>{
    P.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
    if(P.size===1){moved=false;pd=0;pm=null}
    else if(P.size===2){ // empieza el pellizco: medir ya la distancia inicial
      const [a,b]=[...P.values()],r=vp.getBoundingClientRect();
      pd=Math.hypot(a.x-b.x,a.y-b.y);pm={x:(a.x+b.x)/2-r.left,y:(a.y+b.y)/2-r.top};
    }
  });
  vp.addEventListener('pointermove',e=>{
    const p=P.get(e.pointerId);if(!p)return;
    const px=p.x,py=p.y;p.x=e.clientX;p.y=e.clientY;
    if(P.size===1){
      if(!moved&&Math.hypot(p.x-p.sx,p.y-p.sy)<6)return;
      if(!moved){moved=true;try{vp.setPointerCapture(e.pointerId)}catch(_){}}
      st.pan(p.x-px,p.y-py);
    }else if(P.size===2){
      moved=true;
      const [a,b]=[...P.values()],r=vp.getBoundingClientRect(),
        d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;
      if(pm)st.pan(mx-pm.x,my-pm.y);
      if(pd)st.zoom(d/pd,mx,my);
      pd=d;pm={x:mx,y:my};
    }
  });
  const up=e=>{
    P.delete(e.pointerId);pd=0;pm=null;
    if(P.size===1){const q=[...P.values()][0];q.sx=q.x;q.sy=q.y}
  };
  vp.addEventListener('pointerup',up);
  vp.addEventListener('pointercancel',up);
  vp.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=vp.getBoundingClientRect();
    st.zoom(e.deltaY<0?1.1:1/1.1,e.clientX-r.left,e.clientY-r.top);
  },{passive:false});
  return st;
}
const dpz=pz($('#map'),$('#mapin')),fpz=pz($('#fmap'),$('#fmapin'));
const curPZ=()=>!$('#fview').hidden?fpz:(doc&&view==='map'&&!$('#docv').hidden?dpz:null);

// ---- Vista mapa: los nodos siempre se ven, lo que se oculta es SU TEXTO ----
function hsOf(i){
  if(i.type==='pdf')return Object.values(i.cards||{}).filter(c=>c.hd).sort((a,b)=>a.p-b.p||a.y-b.y||a.x-b.x).map(c=>({l:c.hd,t:c.t||'(sin título)'}));
  const t=document.createElement('template');t.innerHTML=i.html||'';
  return [...t.content.querySelectorAll('.ln[data-t=h]')].map(L=>({l:+L.dataset.l,t:L.textContent.replace(/\u200b/g,'').trim()||'(sin título)'}));
}
function headingsList(){if(doc.type!=='pdf')flush();return hsOf(doc)}
function buildTree(hs){ // cada encabezado cuelga del anterior más cercano de orden menor
  const root={c:[]},st=[{l:0,n:root}];let k=0;
  hs.forEach(h=>{
    while(st[st.length-1].l>=h.l)st.pop();
    const n={l:h.l,t:h.t,c:[],k:k++};
    st[st.length-1].n.c.push(n);st.push({l:h.l,n});
  });
  return root;
}
// ---- Dibujo del mapa: nodos redondeados unidos por curvas, de izquierda a derecha ----
function nodeSize(n){
  const f=n.kind==='r'?17:13,cw=f*.56,maxW=n.kind==='r'?280:230,chars=[...n.t].length;
  const w=Math.min(maxW,Math.max(n.kind==='r'?120:70,Math.ceil(chars*cw)+40));
  const lines=Math.max(1,Math.ceil(chars*cw/(w-40)));
  return {w,h:Math.max(n.kind==='r'?48:38,Math.round(lines*f*1.35+18))};
}
function layoutTree(root){
  const HG=64,VG=16,cols=[];
  (function sz(n,d){n.d=d;Object.assign(n,nodeSize(n));cols[d]=Math.max(cols[d]||0,n.w);n.c.forEach(c=>sz(c,d+1))})(root,0);
  const xs=[];let acc=0;
  cols.forEach((w,i)=>{xs[i]=acc;acc+=w+HG});
  let cur=0;
  (function pos(n){
    n.x=xs[n.d];
    if(!n.c.length){n.y=cur;cur+=n.h+VG;return}
    n.c.forEach(pos);
    const a=n.c[0],b=n.c[n.c.length-1];
    n.y=(a.y+a.h/2+b.y+b.h/2)/2-n.h/2;      // el padre queda centrado respecto a sus hijos
  })(root);
  const all=[];(function col(n){all.push(n);n.c.forEach(col)})(root);
  const minY=Math.min(...all.map(n=>n.y)),maxY=Math.max(...all.map(n=>n.y+n.h));
  all.forEach(n=>{n.y-=minY});
  return {all,W:acc-HG,H:maxY-minY};
}
function partHTML(L,hid,ox,oy){
  let paths='';
  L.all.forEach(p=>p.c.forEach(c=>{
    const x1=ox+p.x+p.w,y1=oy+p.y+p.h/2,x2=ox+c.x,y2=oy+c.y+c.h/2,mx=(x1+x2)/2;
    paths+=`<path d="M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" fill="none" stroke="rgba(100,80,60,${(.3-Math.min(p.d,3)*.05).toFixed(2)})" stroke-width="${Math.max(1.2,2-p.d*.4).toFixed(1)}"/>`;
  }));
  const nodes=L.all.map(n=>{
    const st=`left:${ox+n.x}px;top:${oy+n.y}px;width:${n.w}px;height:${n.h}px`;
    if(n.kind==='r')return `<div class="nb mr${n.id?' fn':''}"${n.id?` data-id="${n.id}"`:''} style="${st}"><span class="nt">${esc(n.t)}</span></div>`;
    return `<div class="nb mt d${Math.min(n.d,2)}${hid.has(n.key)?' hid':''}" data-k="${n.key}" style="${st}"><span class="nt">${esc(n.t)}</span></div>`;
  }).join('');
  return {paths,nodes};
}
const wrapMap=(W,H,paths,nodes)=>`<div class="mw" style="width:${W}px;height:${H}px"><svg class="me" width="${W}" height="${H}">${paths}</svg>${nodes}</div>`;
function mapHTML(root,hid){
  const L=layoutTree(root),p=partHTML(L,hid,0,0);
  return {html:wrapMap(L.W,L.H,p.paths,p.nodes),W:L.W,H:L.H};
}
// Reparte varios mapas independientes en columnas (cada uno va a la columna más corta)
// y elige el número de columnas que deja la forma más parecida a una pantalla (~16:9)
function packMaps(Ls){
  const GAP=90;
  const run=n=>{
    const hs=Array(n).fill(0),cols=Array.from({length:n},()=>[]);
    Ls.forEach(l=>{let c=0;for(let i=1;i<n;i++)if(hs[i]<hs[c])c=i;cols[c].push(l);l.oy=hs[c];hs[c]+=l.H+GAP});
    let x=0;
    cols.forEach(col=>{const w=Math.max(0,...col.map(l=>l.W));col.forEach(l=>{l.ox=x});x+=w+GAP});
    return {W:Math.max(1,x-GAP),H:Math.max(1,Math.max(...hs)-GAP)};
  };
  let best=null;
  for(let n=1;n<=Math.min(4,Ls.length);n++){
    const r=run(n),sc=Math.abs(Math.log(r.W/r.H)-Math.log(1.8));
    if(!best||sc<best.sc)best={n,sc};
  }
  return run(best.n);
}
const conv=(n,pre)=>({t:n.t,kind:'h',key:pre+n.k,c:n.c.map(x=>conv(x,pre))});
function renderMap(){
  const tree=buildTree(headingsList());
  if(!tree.c.length){$('#mapin').innerHTML='<p class="empty">Aún no hay encabezados. Márcalos con Alt+1 … Alt+6.</p>';return {W:0,H:0}}
  const m=mapHTML({t:doc.name,kind:'r',c:tree.c.map(x=>conv(x,''))},mapHid);
  $('#mapin').innerHTML=m.html;
  return m;
}

// ---- Mapa de una carpeta: todos sus archivos juntos ----
let fHid=new Set();
function folderMap(fid){
  const f=S.folders.find(x=>x.id===fid);
  if(!f)return;
  flush();doc=null;hideBar();hideSm();closePit();
  $('#home').hidden=true;$('#docv').hidden=true;$('#fview').hidden=false;setTheme(false);
  $('#ftitle').textContent='Mapa · '+f.name;
  fHid=new Set();fpz.reset();
  const its=vi().filter(i=>i.folder===fid);
  if(!its.length){$('#fmapin').innerHTML='<p class="empty">Esta carpeta no tiene archivos.</p>';return}
  // cada archivo (tema) es la raíz de su propio mapa; no hay nodo con el nombre de la carpeta
  const trees=its.map((i,n)=>layoutTree({t:i.name,kind:'r',id:i.id,c:buildTree(hsOf(i)).c.map(x=>conv(x,n+'_'))}));
  const P=packMaps(trees);
  let paths='',nodes='';
  trees.forEach(L=>{const p=partHTML(L,fHid,L.ox,L.oy);paths+=p.paths;nodes+=p.nodes});
  $('#fmapin').innerHTML=wrapMap(P.W,P.H,paths,nodes);
  fpz.fit(P.W,P.H);
}
$('#fmap').addEventListener('click',e=>{
  const t=e.target.closest('.mt');
  if(t&&t.dataset.k){
    const k=t.dataset.k;
    fHid.has(k)?fHid.delete(k):fHid.add(k);
    t.classList.toggle('hid',fHid.has(k));
    return;

    else{
      const bin=atob(String(o.pdf||'')),a=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
      if(String.fromCharCode(a[0],a[1],a[2],a[3])!=='%PDF')throw 0;
      await pdfPut(id,new Blob([a],{type:'application/pdf'}));
    }
    S.items.push(it);persist();home();toast('Documento importado');
  }catch(_){toast('Este archivo no es un documento .hq válido')}
}
// ---- Dividir un documento o un PDF: la segunda mitad pasa a un documento nuevo de la misma carpeta ----
function splitCmd(r){
  if(!doc||mode!=='edit')return;
  if(doc.type==='pdf'){
    const pg=(r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement).closest('.pg');
    splitPdfAsk(pg?+pg.dataset.p+1:2);return;
  }
  splitText();
}
function splitText(){
  const L=curLine();
  if(!L||!ed.contains(L))return toast('Coloca el cursor en la línea donde quieres dividir');
  const k=[...ed.children].indexOf(L);
  if(k<=0)return toast('Elige una línea que no sea la primera');
  sure('Se creará un documento nuevo con lo que hay desde esta línea hasta el final. ¿Dividir?',()=>{
    flush();
    const t=document.createElement('template');t.innerHTML=doc.html||'';
    const kids=[...t.content.children],mh=kids.slice(k).map(e=>e.outerHTML).join(''),kh=kids.slice(0,k).map(e=>e.outerHTML).join('');
    const ids=new Set(idsIn(mh)),mc={},kc={};
    for(const [id,c] of Object.entries(doc.cards))(ids.has(id)?mc:kc)[id]=c;
    const now=Date.now(),nd={id:uid(),type:'doc',name:doc.name+' (2)',folder:doc.folder,html:mh,cards:mc,updated:now};
    S.items.push(nd);
    doc.html=kh;doc.cards=kc;doc.updated=now;
    ed.innerHTML=kh;norm();paint();persist();
    toast('Documento nuevo: '+nd.name);
  },'Dividir');
}
function splitPdfAsk(def){
  const n=$('#pages').querySelectorAll('.pg').length;
  if(n<2)return toast('Este PDF solo tiene una página');
  const d=Math.min(n,Math.max(2,def||2));
  modal(`<h3>Dividir PDF</h3><p style="margin:.2rem 0 .6rem;font-size:.9rem">Tiene ${n} páginas. Desde la página que indiques pasarán a un documento nuevo; este conservará las anteriores.</p><input id="spn" type="number" min="2" max="${n}" value="${d}"><button data-x="ok">Dividir</button><button data-x="no">Cancelar</button>`,x=>{
    if(x!=='ok'){dlg.close();return}
    const k=Math.round(+$('#spn').value);
    if(!(k>=2&&k<=n))return toast(`Escribe un número entre 2 y ${n}`);
    dlg.close();splitPdf(k);
  });
}
async function splitPdf(k){
  if(!window.PDFLib)return toast('No se pudo cargar la herramienta para dividir PDFs (¿sin conexión?)');
  const d=doc;toast('Dividiendo…');
  try{
    const blob=await getBlob(d.id);if(!blob)throw 0;
    const src=await PDFLib.PDFDocument.load(new Uint8Array(await readBuf(blob))),n=src.getPageCount();
    if(k<2||k>n)throw 0;
    const part=async idx=>{const o=await PDFLib.PDFDocument.create();(await o.copyPages(src,idx)).forEach(p=>o.addPage(p));return o.save()};
    const A=await part([...Array(k-1).keys()]),B=await part([...Array(n-k+1).keys()].map(i=>i+k-1));
    const keep={},moved={},state={};
    for(const [id,c] of Object.entries(d.cards)){
      if(c.r){
        const mr=c.r.filter(r=>r.p>=k).map(r=>({...r,p:r.p-k+1})),kr=c.r.filter(r=>r.p<k);
        if(kr.length)keep[id]={...c,r:kr};if(mr.length)moved[id]={...c,r:mr};
      }else if(c.pit||c.hd||c.img){c.p>=k?moved[id]={...c,p:c.p-k+1}:keep[id]=c}
      else state[id]=c;
    }
    const mIds=new Set(Object.values(moved).flatMap(subIds));
    for(const [id,c] of Object.entries(state))(mIds.has(id)?moved:keep)[id]=c;
    const nid=uid(),now=Date.now();
    await pdfPut(nid,new Blob([B],{type:'application/pdf'}));
    await pdfPut(d.id,new Blob([A],{type:'application/pdf'}));
    if(user)localStorage.removeItem('slpdf_'+user.id+'_'+d.id);   // el PDF cambió: que se vuelva a subir
    S.items.push({id:nid,type:'pdf',name:d.name+' (2)',folder:d.folder,html:'',cards:moved,updated:now});
    d.cards=keep;d.updated=now;persist();
    if(doc===d)loadPdf();
    toast('PDF dividido: «'+d.name+' (2)»');
  }catch(_){toast('No se pudo dividir este PDF')}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&user)sync()});  // al volver a la pestaña se traen los cambios de otros dispositivos

// ============================================================
// SINCRONIZACIÓN BIDIRECCIONAL (fusión por id)
//
//  1. Descarga las filas remotas del usuario (no toca S).
//  2. Fusiona remoto -> local en un bloque SIN awaits:
//       solo remoto  -> se incorpora
//       ambos        -> gana el de `updated` mayor (empate: remoto)
//  3. Sube local -> remoto (inserta lo que falta, actualiza si local es más nuevo).
//  4. Cada await comprueba que la sesión sigue siendo la misma (gen/user);
//     si cambió, la operación se abandona sin tocar S, la UI ni localStorage.
// ============================================================

async function fetchAll(t,owner,chk){
  const out=[];
  for(let a=0;;a+=500){
    const {data,error}=await sb
      .from(t)
      .select('*')
      .eq('user_id',owner)
      .order('id')
      .range(a,a+499);
    chk();
    if(error)throw error;
    out.push(...(data||[]));
    if(!data||data.length<500)break;
  }
  return out;
}

async function sync(){
  if(!sb||!user)return;

  const g=gen;
  const owner=user.id;

  // Ya hay una sincronización de ESTA sesión: encolar otra al terminar.
  if(syncing===g){pending=true;return}
  syncing=g;
  pending=false;

  const STALE=new Error('sesión cambiada');
  const chk=()=>{
    if(g!==gen||!user||user.id!==owner)throw STALE;
  };
  const row=l=>({...l,user_id:owner,del:!!l.del});
  const clean=r=>{const {user_id,...x}=r;return x};

  $('#st').textContent='Sincronizando…';

  try{
    // ---------- 1. descargar (solo lectura) ----------
    const rf=await fetchAll('folders',owner,chk);
    const ri=await fetchAll('items',owner,chk);
    chk();

    // ---------- 2. fusionar remoto -> local (síncrono) ----------
    if(dirty&&doc)flush(); // ediciones aún no volcadas: que compitan con su fecha real
    const prev=doc?{id:doc.id,html:doc.html,updated:doc.updated}:null;
    const merge=(loc,rows)=>{
      rows.forEach(raw=>{
        const r=clean(raw);
        const i=loc.findIndex(x=>x.id===r.id);
        if(i<0)loc.push(r);
        else if((r.updated||0)>=(loc[i].updated||0))loc[i]=r;
      });
    };
    merge(S.folders,rf);
    merge(S.items,ri);

    // ---------- 3. subir local -> remoto ----------
    const remoteF=new Map(rf.map(r=>[r.id,r]));
    const remoteI=new Map(ri.map(r=>[r.id,r]));

    // Comprueba si una fila propia con ese id ya existe (carrera entre dispositivos)
    const mine=async(t,id)=>{
      const {data,error}=await sb.from(t).select('id,updated').eq('id',id).eq('user_id',owner);
      chk();
      if(error)throw error;
      return (data||[])[0]||null;
    };

    // Carpetas
    for(const id0 of S.folders.map(x=>x.id)){
      let id=id0;
      for(let a=0;a<5;a++){
        const l=S.folders.find(x=>x.id===id);
        if(!l)break;
        const r=remoteF.get(id);
        if(r){
          if((l.updated||0)>(r.updated||0)){
            const {error}=await sb.from('folders').update(row(l)).eq('id',id).eq('user_id',owner);
            chk();
            if(error)throw error;
            remoteF.set(id,{...l,user_id:owner});
          }
          break;
        }
        const {error}=await sb.from('folders').insert(row(l));
        chk();
        if(!error){remoteF.set(id,{...l,user_id:owner});break}
        if(error.code!=='23505')throw error;      // RLS u otro error: NO es colisión
        const ex=await mine('folders',id);
        if(ex){remoteF.set(id,ex);continue}       // era nuestra: actualizar en la vuelta siguiente
        // Colisión real (el id pertenece a otra cuenta): nuevo id + referencias
        const nid=uid(),now=Date.now();
        l.id=nid;l.updated=now;
        S.items.forEach(i=>{if(i.folder===id){i.folder=nid;i.updated=now}});
        if(cur===id)cur=nid;
        id=nid;
      }
    }

    // Documentos
    for(const id0 of S.items.map(x=>x.id)){
      let id=id0;
      for(let a=0;a<5;a++){
        const l=S.items.find(x=>x.id===id);
        if(!l)break;
        const r=remoteI.get(id);
        if(r){
          if((l.updated||0)>(r.updated||0)){
            const {error}=await sb.from('items').update(row(l)).eq('id',id).eq('user_id',owner);
            chk();
            if(error)throw error;
            remoteI.set(id,{...l,user_id:owner});
          }
          break;
        }
        const {error}=await sb.from('items').insert(row(l));
        chk();
        if(!error){remoteI.set(id,{...l,user_id:owner});break}
        if(error.code!=='23505')throw error;
        const ex=await mine('items',id);
        if(ex){remoteI.set(id,ex);continue}
        // Colisión real: nuevo id, conservar PDF local y reseñas
        const nid=uid();
        if(l.type==='pdf'){
          const b=await pdfGet(id);
          chk();
          if(b){await pdfPut(nid,b);chk()}
        }
        const {error:re}=await sb.from('reviews').update({item_id:nid}).eq('item_id',id).eq('user_id',owner);
        chk();
        if(re)throw re;
        l.id=nid;l.updated=Date.now();
        id=nid;
      }

      // PDF -> Storage (solo si existe el archivo local)
      const l=S.items.find(x=>x.id===id);
      if(l&&l.type==='pdf'&&!l.del){
        const flag='slpdf_'+owner+'_'+l.id;
        if(!localStorage.getItem(flag)){
          const b=await pdfGet(l.id);
          chk();
          if(b){
            const {error:pe}=await sb.storage.from('pdfs').upload(`${owner}/${l.id}.pdf`,b,{upsert:true,contentType:'application/pdf'});
            chk();
            if(pe)throw pe;
            localStorage.setItem(flag,'1');
          }
        }
      }
    }

    // ---------- 4. guardar y refrescar ----------
    chk();
    localStorage.setItem('sl1_'+owner,JSON.stringify(S));

    if(doc){
      const nd=S.items.find(i=>i.id===doc.id);
      if(!nd||nd.del){
        doc=null;
        home();
      }else{
        const replaced=nd!==doc;
        doc=nd;
        if(replaced&&prev&&(nd.html!==prev.html||nd.updated!==prev.updated)){
          if(doc.type==='pdf'){renderOv();paint()}
          else{ed.innerHTML=doc.html||'';norm();paint()}
        }
      }
    }else{
      home();
    }
    $('#st').textContent='Sincronizado';

  }catch(e){
    if(e!==STALE){
      console.error('Error de sincronización:',e);
      if(g===gen)$('#st').textContent='Error de sincronización';
    }
  }finally{
    if(syncing===g)syncing=false;
    if(pending&&g===gen&&user&&user.id===owner){
      pending=false;
      setTimeout(sync,0);
    }
  }
}

$('#acct').onclick=()=>{

  if(!sb){
    return modal(
      '<h3>Nube no configurada</h3>'+
      '<p>Rellena CFG.url y CFG.key.</p>',
      ()=>{}
    );
  }

  if(user){
    return modal(
      `<h3>${esc(user.email)}</h3>
       <button data-x="sync">Sincronizar ahora</button>
       <button data-x="out">Cerrar sesión</button>`,
      async x=>{
        dlg.close();

        if(x==='out'){
          await sb.auth.signOut();
        }else if(x==='sync'){
          sync();
        }
      }
    );
  }

  modal(
    '<h3>Cuenta</h3>'+
    '<input id="em" type="email" placeholder="Email">'+
    '<input id="pw" type="password" placeholder="Contraseña (mín. 8)">'+
    '<p id="am"></p>'+
    '<button data-x="in">Entrar</button>'+
    '<button data-x="up">Crear cuenta</button>',
    async x=>{

      const email=$('#em').value;
      const password=$('#pw').value;

      if(
        !email ||
        !password
      ){
        $('#am').textContent=
          'Introduce email y contraseña.';
        return;
      }

      const r=
        x==='in'
          ?await sb.auth.signInWithPassword({
            email,
            password
          })
          :await sb.auth.signUp({
            email,
            password,
            options:{
              emailRedirectTo:
                'https://jeprats.github.io/StudyLines/'
            }
          });

      if(r.error){

        $('#am').textContent=
          r.error.message;

      }else if(!r.data.session){

        $('#am').textContent=
          'Revisa tu correo para confirmar la cuenta.';

      }else{

        dlg.close();
      }
    }
  );
};
