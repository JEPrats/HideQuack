<style>
:root{--bg:#f4efe2;--pp:#f4efe2;--tx:#3d3b36;--mut:#8b8678;--ln:#dfd8c5;--ne:#e7e0cd;--re:#f0d5cd;--le:#d6e5cf;--ac:#6d6757}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.2rem;border-bottom:1px solid var(--ln)}
#logo{margin:0;font:600 1.25rem Georgia,serif;cursor:pointer;letter-spacing:.01em}
#crumb,#st,#stats{color:var(--mut);font-size:.9rem}.sp{flex:1}
button,.btn{font:inherit;font-size:.9rem;background:transparent;color:var(--ac);border:1px solid var(--ln);border-radius:8px;padding:.4rem .8rem;cursor:pointer}
button:hover,.btn:hover,button.on{background:var(--ne)}
main{max-width:1000px;margin:0 auto;padding:1.2rem}
.bar,.tb{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin-bottom:1.2rem}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem}
.tile{position:relative;background:var(--pp);border:1px solid var(--ln);border-radius:12px;padding:1rem;cursor:pointer;min-height:140px}
.tile:hover{background:var(--ne)}.ic{font-size:1.8rem}.nm{margin-top:.5rem;font-weight:500;word-break:break-word}.mt{color:var(--mut);font-size:.8rem}
.dots{position:absolute;top:.4rem;right:.4rem;border:0;padding:.1rem .5rem;font-size:1.2rem}
.empty{grid-column:1/-1;color:var(--mut);text-align:center;padding:3rem 0}
#dname{font:600 1.1rem Georgia,serif;border:0;background:transparent;color:var(--tx);min-width:0;flex:1 1 200px}
#paper{position:relative;padding:1rem min(4vw,2.5rem) 6rem;min-height:60vh}#paper.pdf{padding:.5rem 0 6rem}
.ed{outline:0;font:1.05rem/1.75 Georgia,"Times New Roman",serif;min-height:55vh}
.ln[data-t=i]{padding-left:0;margin:.5em 0}
.im{position:relative;display:inline-block;max-width:100%;line-height:0;touch-action:auto;user-select:none;-webkit-user-select:none}
#ed.study .im{touch-action:auto}.im img{max-width:100%;height:auto;display:block;border-radius:4px}
.im .x{position:absolute;top:4px;right:4px;display:none;line-height:1;padding:.15rem .5rem;background:var(--pp)}
#ed.drawing .im{cursor:crosshair;touch-action:none}#ed.drawing .im img{outline:2px dashed var(--mut)}#ed:not(.study) .im .x{display:block}
.cur{position:absolute;background:rgba(140,130,100,.3);border:1px dashed var(--mut);scroll-margin-bottom:110px}
.cur[data-s=r]{background:rgba(205,95,75,.3)}.cur[data-s=l]{background:rgba(95,150,80,.3)}
.cx{position:absolute;top:2px;right:2px;display:none;line-height:1;padding:0 .35rem;font-size:.85rem;background:var(--pp)}#ed:not(.study) .cur .cx{display:block}
.study .cur{z-index:2;border:0;cursor:pointer;background:#e1dac7}.study .cur[data-s=r]{background:#ecccc3}.study .cur[data-s=l]{background:#cfe0c7}
.study .cur.open{background:rgba(140,130,100,.15)}.study .cur.open[data-s=r]{background:rgba(205,95,75,.18)}.study .cur.open[data-s=l]{background:rgba(95,150,80,.18)}
.study .cur.na{background:transparent;pointer-events:none}
.cm{font-size:.85em;font-style:italic;color:var(--mut);margin-left:.5em}.cm::before{content:"✎ "}
.study .card:not(.open):not(.na) .cm{color:transparent}
.lnk{cursor:pointer;text-decoration:underline}
select{font:inherit;font-size:.9rem;background:var(--pp);color:var(--ac);border:1px solid var(--ln);border-radius:8px;padding:.4rem .6rem}
#pages{max-width:900px;margin:0 auto}
.pg{position:relative;margin:0 auto 1rem;background:var(--bg);isolation:isolate;box-shadow:0 0 0 1px var(--ln)}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;transform-origin:0 0}
.textLayer ::selection{background:rgba(110,100,70,.3)}
.ov{position:absolute;inset:0;z-index:1;pointer-events:none}
.pc{position:absolute;border-radius:2px;background:rgba(140,130,100,.2);scroll-margin-bottom:110px}
.pc[data-s=r]{background:rgba(205,95,75,.22)}.pc[data-s=l]{background:rgba(95,150,80,.22)}
#pages.study .ov{z-index:3}#pages.study .textLayer{pointer-events:none}
#pages.study .pc{pointer-events:auto;cursor:pointer;background:#e1dac7}
#pages.study .pc[data-s=r]{background:#ecccc3}#pages.study .pc[data-s=l]{background:#cfe0c7}
#pages.study .pc.open{background:rgba(140,130,100,.18)}#pages.study .pc.open[data-s=r]{background:rgba(205,95,75,.2)}#pages.study .pc.open[data-s=l]{background:rgba(95,150,80,.2)}
#pages.study .pc.na{display:none}
.ln{position:relative;min-height:1.75em;padding-left:calc(1.5em + var(--l,0)*1.6em)}
.ln[data-t=b]::before{content:"•";position:absolute;left:calc(.3em + var(--l,0)*1.6em);color:var(--mut)}
.ln[data-t=e],.ln[data-t=p],.ln[data-t=h]{padding-left:0}
.ln[data-t=p]{margin:.3em 0}
.ln[data-t=h]{font-weight:600;line-height:1.3;margin-top:.7em;margin-bottom:.2em;font-size:1.2em}
.ln[data-t=h][data-l="1"]{font-size:1.75em}.ln[data-t=h][data-l="2"]{font-size:1.45em}.ln[data-t=h][data-l="3"]{font-size:1.25em}.ln[data-t=h][data-l="4"]{font-size:1.1em}.ln[data-t=h][data-l="5"]{font-size:1em}.ln[data-t=h][data-l="6"]{font-size:.9em}
.card{font-weight:400;background:var(--ne);border-radius:4px;padding:0 .2em}
.card::before{content:"→";color:var(--mut);margin:0 .25em 0 .1em}
.card[data-s=r]{background:var(--re)}.card[data-s=l]{background:var(--le)}
.study .card:not(.open):not(.na){color:transparent;cursor:pointer;user-select:none;-webkit-user-select:none;min-width:3em;display:inline-block}
.study .card{user-select:none;-webkit-user-select:none;scroll-margin-bottom:110px}.study .card:not(.na){cursor:pointer}
.study .card:not(.open):not(.na)::before{color:var(--mut)}
#rbar{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:.4rem;background:var(--pp);border:1px solid var(--ln);border-radius:12px;padding:.35rem;box-shadow:0 2px 12px #0003}
#rbar button.r.on{background:var(--re)}#rbar button.l.on{background:var(--le)}
dialog{border:1px solid var(--ln);border-radius:12px;background:var(--pp);color:var(--tx);max-width:360px;width:90%}
dialog h3{margin:0 0 .6rem}dialog button,dialog input{display:block;width:100%;margin:.4rem 0;padding:.5rem;font:inherit}
dialog input{border:1px solid var(--ln);border-radius:8px;background:var(--pp);color:var(--tx)}
#menu{position:fixed;z-index:20;background:var(--pp);border:1px solid var(--ln);border-radius:10px;padding:.3rem;box-shadow:0 2px 10px #0002}
#menu button{display:block;width:100%;border:0;text-align:left}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:.5rem 1rem;border-radius:8px;opacity:0;transition:.3s;pointer-events:none}
.pit,.pi{display:block;width:.95em;height:.95em;background:#ecd98a;border-radius:2px 2px 7px 2px;cursor:pointer;box-shadow:0 1px 2px #0003}
.pit{position:absolute;right:-1.5em;top:.4em}
.pi{position:absolute;z-index:4;right:.8%}
.study .card:not(.open):not(.na) .pit{visibility:hidden}
.hb{position:absolute;z-index:4;width:1.15rem;height:1.15rem;border-radius:50%;background:#c4574a;color:#fff;font:600 .7rem/1.15rem system-ui,sans-serif;text-align:center;cursor:pointer;transform:translate(-50%,0)}
#pages.study .hb{display:none}
#sm,#pp{position:fixed;z-index:40;background:var(--pp);border:1px solid var(--ln);border-radius:10px;padding:.3rem;box-shadow:0 2px 12px #0003}
#sm button{display:block;width:100%;text-align:left;border:0}.smh{position:relative}
#smn{position:absolute;left:100%;top:0;display:flex;flex-direction:column;background:var(--pp);border:1px solid var(--ln);border-radius:10px;padding:.3rem;box-shadow:0 2px 12px #0003}
#sm.flip #smn{left:auto;right:100%}#smn button{text-align:center}
#pp{width:240px}#ptx{width:100%;font:inherit;font-size:.9rem;background:var(--pp);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:.4rem;resize:vertical}#pdel{width:100%;margin-top:.3rem}
#map,#fmap{position:relative;overflow:hidden;height:72vh;touch-action:none;cursor:grab;border:1px solid var(--ln);border-radius:12px}
#mapin,#fmapin{position:absolute;left:0;top:0;transform-origin:0 0;width:max-content;user-select:none;-webkit-user-select:none}
.fm{margin-bottom:2.5rem}.fn{font:600 1rem Georgia,serif;margin-bottom:.6rem;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:999px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:.35rem .9rem}.seg button.on{background:var(--ne);color:var(--tx);font-weight:600}.mn{display:flex;align-items:center}
.mt{border:1px solid var(--ln);background:var(--ne);border-radius:8px;padding:.35rem .7rem;max-width:260px;font:.95rem Georgia,serif;cursor:pointer}.mt.hid{color:transparent;min-width:3.5em;user-select:none;-webkit-user-select:none}

.mc{display:flex;flex-direction:column;gap:.5rem;margin-left:1.2rem;padding-left:1rem;border-left:1px solid var(--mut)}.mc.root{margin:0;padding:0;border:0}
</style></head><body>

<header>
<h1 id="logo">StudyLines</h1>
<span id="crumb"></span>
<div class="sp"></div>
<span id="st"></span>
<button id="acct">Cuenta</button>
</header>

<main id="home">
<div class="bar">
<button id="nf">+ Carpeta</button>
<button id="nd">+ Documento</button>
<label class="btn">Importar PDF<input id="pdfIn" type="file" accept="application/pdf" hidden></label>

</main>

<main id="docv" hidden>
<div class="tb">

<option value="all">Estudiar todas</option>

<option value="learned">Solo aprendidas</option>
</select>

<div class="seg" id="tm"><button data-v="edit">Editar</button><button data-v="study">Estudiar</button></div>
</div>

<div id="paper">
<div id="ed" class="ed"></div>
<div id="pages" hidden></div><div id="map" hidden><div id="mapin"></div></div>

<div id="rbar" hidden>
<button class="r" data-r="r" title="Pulsa de nuevo para volver a neutro">Repasar</button>
<button class="l" data-r="l" title="Pulsa de nuevo para volver a neutro">Aprendido</button>
</div>
</div>
</main>

<main id="fview" hidden><div class="tb"><strong id="ftitle"></strong><span id="fhint" style="color:var(--mut);font-size:.85rem">Arrastra o usa los dedos · W A S D para moverte · + / − para el zoom</span><div class="sp"></div><button id="fback">← Volver</button></div><div id="fmap"><div id="fmapin"></div></div></main>
<div id="sm" hidden><button data-a="hide">Ocultar selección</button><button data-a="pit">Posit</button>
<div class="smh"><button data-a="h">Encabezado ›</button><div id="smn" hidden><button data-h="1">1</button><button data-h="2">2</button><button data-h="3">3</button><button data-h="4">4</button><button data-h="5">5</button><button data-h="6">6</button></div></div></div>

<dialog id="dlg"></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>

// ============================================================
// CONFIGURACIÓN SUPABASE
// ============================================================

const CFG={
  url:"https://vfrtxbzuigknhazkeqhp.supabase.co",
  key:"sb_publishable_fcS_tBfraMvUmh7bfiOSvA_HEG3KYFD"
};

// ============================================================
// BASE
// ============================================================

const $=s=>document.querySelector(s);
const ed=$('#ed');
const dlg=$('#dlg');
const bar=$('#rbar');

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;'
}[c]));

let stateOwner=null; // cuenta a la que pertenece S (null = modo local sin cuenta)
let S={folders:[],items:[]};
let cur=null;
let doc=null;
let mode='edit';
let flt="all";
let active=null;
let st=0;
let dirty=false; // hay cambios del editor pendientes de volcar a doc

const vf=()=>S.folders.filter(f=>!f.del);
const vi=()=>S.items.filter(i=>!i.del);

const persist=()=>{
  localStorage.setItem(
    stateOwner?'sl1_'+stateOwner:'sl1',
    JSON.stringify(S)
  );
  schedSync();
};

const toast=m=>{
  const t=$('#toast');
  t.textContent=m;
  t.style.opacity=1;
  setTimeout(()=>t.style.opacity=0,2200);
};

function modal(h,fn){
  if(dlg.open)dlg.close();

  dlg.innerHTML=h;

  dlg.onclick=e=>{
    const b=e.target.closest('[data-x]');

    if(e.target===dlg){
      dlg.close();
    }else if(b){
      fn(b.dataset.x);
    }
  };

  dlg.showModal();
}

// ============================================================
// INDEXED DB — PDF ORIGINALES
// ============================================================

const idb=()=>new Promise((ok,ko)=>{
  const r=indexedDB.open('sl',1);

  r.onupgradeneeded=()=>{
    r.result.createObjectStore('pdf');
  };

  r.onsuccess=()=>ok(r.result);
  r.onerror=ko;
});

const pdfPut=async(k,b)=>{
  const d=await idb();

  return new Promise(ok=>{
    const t=d.transaction('pdf','readwrite');
    t.objectStore('pdf').put(b,k);
    t.oncomplete=ok;
  });
};

const pdfGet=async k=>{
  const d=await idb();

  return new Promise(ok=>{
    const q=d.transaction('pdf').objectStore('pdf').get(k);
    q.onsuccess=()=>ok(q.result);
  });
};

// ============================================================
// ESCRITORIO
// ============================================================

function ask(title,val,cb){
  modal(
    `<h3>${esc(title)}</h3>
     <input id="ai" value="${esc(val||'')}">
     <button data-x="ok">Aceptar</button>
     <button data-x="no">Cancelar</button>`,
    x=>{
      if(x==='ok'){
        const v=$('#ai').value.trim();

        if(v){
          dlg.close();
          cb(v);
        }
      }else{
        dlg.close();
      }
    }
  );

  const i=$('#ai');
  i.focus();
  i.select();

  i.onkeydown=e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      dlg.querySelector('[data-x=ok]').click();
    }
  };
}

function sure(msg,cb,lab){
  modal(
    `<h3>${esc(msg)}</h3>
     <button data-x="ok">${lab||'Eliminar'}</button>
     <button data-x="no">Cancelar</button>`,
    x=>{
      dlg.close();
      if(x==='ok')cb();
    }
  );
}

const cardIds=i=>i.type==='pdf'
  ?Object.keys(i.cards||{}).filter(k=>i.cards[k].r)
  :[...(i.html||'').matchAll(/data-id="([^"]+)"/g)].map(m=>m[1]);

function pr(its){
  let t=0,l=0;

  its.forEach(i=>{
    const d=cardIds(i);

    t+=d.length;
    l+=d.filter(k=>((i.cards||{})[k]||{}).s==='l').length;
  });

  return t?'✓ '+l+'/'+t:'Sin tarjetas';
}

const progI=i=>pr([i]);
const progF=id=>pr(vi().filter(i=>i.folder===id));

const tile=(k,id,ic,n,m)=>`
<div class="tile" data-k="${k}" data-id="${id}">
<div class="ic">${ic}</div>
<div class="nm">${esc(n)}</div>
<div class="mt">${m}</div>
<button class="dots" data-m="1" aria-label="Opciones">⋯</button>
</div>`;

function home(){
  flush();

  doc=null;
  hideBar();

  $('#pages').innerHTML='';
  $('#home').hidden=false;$('#fview').hidden=true;
  $('#docv').hidden=true;

  const f=cur&&vf().find(x=>x.id===cur);

  if(!f)cur=null;

  $('#crumb').textContent=f?'/ '+f.name:'';
  $('#crumb').className='';

  let h='';

  if(!cur){
    vf().forEach(x=>{
      h+=tile(
        'f',
        x.id,
        '📁',
        x.name,
        progF(x.id)
      );
    });
  }

  vi()
    .filter(i=>(i.folder||null)===cur)
    .forEach(i=>{
      h+=tile(
        'i',
        i.id,
        i.type==='pdf'?'📕':'📄',
        i.name,
        progI(i)
      );
    });

  $('#grid').innerHTML=
    h||
    '<p class="empty">Todo vacío. Crea una carpeta, un documento o importa un PDF.</p>';
}

$('#logo').onclick=()=>{
  cur=null;
  home();
};

$('#nf').onclick=()=>{
  ask('Nombre de la carpeta','',n=>{
    S.folders.push({
      id:uid(),
      name:n,
      updated:Date.now()
    });

    persist();
    home();
  });
};

$('#nd').onclick=()=>{
  const i={
    id:uid(),
    type:'doc',
    name:'Sin título',
    folder:cur,
    html:'',
    cards:{},
    updated:Date.now()
  };

  S.items.push(i);
  persist();
  openDoc(i.id);
};

$('#grid').onclick=e=>{
  const t=e.target.closest('.tile');

  if(!t)return;

  const k=t.dataset.k;
  const id=t.dataset.id;

  if(e.target.dataset.m){
    menu(k,id,t.getBoundingClientRect());
    return;
  }

  if(k==='f'){
    cur=id;
    home();
  }else{
    openDoc(id);
  }
};

function menu(k,id,r){
  closeMenu();

  const m=document.createElement('div');
  m.id='menu';

  m.innerHTML=
    '<button data-a="ren">Renombrar</button>'+
    (k==='i'?'<button data-a="mov">Mover</button>':'<button data-a="map">Ver mapa</button>')+
    '<button data-a="rst">Reiniciar progreso</button>'+
    '<button data-a="del">Eliminar</button>';

  m.style.top=r.bottom+4+'px';
  m.style.left=Math.max(
    4,
    Math.min(r.left-80,innerWidth-150)
  )+'px';

  document.body.append(m);

  m.onclick=e=>{
    const a=e.target.dataset.a;

    if(!a)return;

    closeMenu();

    const x=(k==='f'?S.folders:S.items)
      .find(y=>y.id===id);

    if(!x)return;

    if(a==='ren'){
      ask('Nuevo nombre',x.name,n=>{
        x.name=n;
        x.updated=Date.now();
        persist();
        home();
      });
    }

    if(a==='mov'){ mover(x); } if(a==='map'){ folderMap(id); }

    if(a==='rst'){
      sure(
        '¿Reiniciar el progreso de "'+x.name+'"?',
        ()=>{
          (k==='f'
            ?vi().filter(i=>i.folder===id)
            :[x]
          ).forEach(resetItem);

          persist();
          home();
        },
        'Reiniciar'
      );
    }

    if(a==='del'){
      sure(
        '¿Eliminar "'+x.name+'"?'+
        (k==='f'
          ?' Sus documentos pasarán al escritorio.'
          :''),
        ()=>{
          if(k==='f'){
            S.items.forEach(i=>{
              if(i.folder===id){
                i.folder=null;
                i.updated=Date.now();
              }
            });
          }

          x.del=true;
          x.updated=Date.now();

          persist();
          home();
        }
      );
    }

const txt=L=>L.textContent.replace(/\u200b/g,'');

const isEmpty=L=>
  !txt(L)&&!L.querySelector('.card');

function setL(L,t,l){
  L.dataset.t=t;
  L.dataset.l=l;
  L.style.setProperty('--l',l);
}

function mk(t,l,h){
  const d=document.createElement('div');

  d.className='ln';
  setL(d,t,l);
  d.innerHTML=h||'<br>';

  return d;
}

function put(el,end){
  const r=document.createRange();

  r.selectNodeContents(el);
  r.collapse(!end);

  const s=getSelection();

  s.removeAllRanges();
  s.addRange(r);
}

function curLine(){
  const s=getSelection();

  if(!s.rangeCount)return null;

  let n=s.anchorNode;

  while(
    n &&
    n!==ed &&
    !(n.nodeType===1&&n.classList.contains('ln'))
  ){
    n=n.parentNode;
  }

  return n&&n!==ed?n:null;
}

function boundary(L,r,end){
  const q=document.createRange();

  q.selectNodeContents(L);

  end
    ?q.setStart(r.endContainer,r.endOffset)
    :q.setEnd(r.startContainer,r.startOffset);

  return q.toString().replace(/\u200b/g,'')==='';
}

function norm(){
  [...ed.childNodes].forEach(n=>{
    if(
      n.nodeType===1 &&
      n.classList.contains('ln')
    )return;

    if(
      n.nodeType===1 &&
      n.tagName!=='BR'
    ){
      n.className='ln';

      if(!n.dataset.t){
        setL(n,'b',0);
      }
    }else{
      const L=mk('b',0,'');

      n.replaceWith(L);

      if(n.nodeName==='BR'){
        L.innerHTML='<br>';
      }else{
        L.innerHTML='';
        L.append(n);
      }
    }
  });

  if(!ed.firstChild){
    ed.append(mk('b',0,''));
  }
}

function ser(){
  const c=ed.cloneNode(true);

  c.querySelectorAll('.card,.cur').forEach(x=>{
    const k=x.classList.contains('cur')
      ?'cur'
      :'card';

    x.className=k;
    x.removeAttribute('data-s');
  });

  return c.innerHTML;
}

function flush(){
  clearTimeout(st);

  if(
    !doc ||
    doc.type==='pdf' ||
    $('#docv').hidden
  )return;
  dirty=false;
  doc.html=ser();
  doc.updated=Date.now();

  persist();
}

const save=()=>{
  dirty=true;
  clearTimeout(st);
  st=setTimeout(flush,400);
};

function join(p,L){
  if(
    p.lastChild &&
    p.lastChild.nodeName==='BR'
  ){
    p.lastChild.remove();
  }

  const pos=p.childNodes.length;

  while(L.firstChild){
    p.append(L.firstChild);
  }

  L.remove();

  if(!p.firstChild){
    p.innerHTML='<br>';
  }

  const r=document.createRange();

  r.setStart(
    p,
    Math.min(pos,p.childNodes.length)
  );

  r.collapse(true);

  const s=getSelection();

  s.removeAllRanges();
  s.addRange(r);
}

ed.addEventListener('keydown',e=>{
  if(
    mode!=='edit' ||
    ed.contentEditable==='false'
  )return;

  if(
    (e.ctrlKey||e.metaKey) &&
    'biu'.includes(e.key.toLowerCase())
  ){
    e.preventDefault();
    return;
  }

  norm();

  const L=curLine();

  if(!L)return;

  const s=getSelection();
  const r=s.getRangeAt(0);
  const t=L.dataset.t;
  const l=+L.dataset.l;

  if(t==='i'){
    if(
      !e.ctrlKey &&
      !e.metaKey &&
      (
        e.key.length===1 ||
        ['Enter','Backspace','Delete','Tab'].includes(e.key)
      )
    ){
      e.preventDefault();
    }

    return;
  }

  if(e.key==='Enter'){
    e.preventDefault();

    if(!r.collapsed){
      r.deleteContents();
    }

    if(
      t==='b' &&
      isEmpty(L)
    ){
      l>0
        ?setL(L,'b',l-1)
        :setL(L,'e',0);

      return save();
    }

    const q=document.createRange();

    q.setStart(r.endContainer,r.endOffset);
    q.setEnd(L,L.childNodes.length); const f=q.extractContents(); f.querySelectorAll('.pit').forEach(p=>L.append(p));

    f.querySelectorAll('.card').forEach(c=>{
      if(!c.textContent.replace(/\u200b/g,'')){
        c.remove();
      }else{
        c.dataset.id=uid();
      }
    });

    const N=mk(
      t==='h'?'b':t,
      t==='h'?0:l,
      ''
    );

    N.innerHTML='';
    N.append(f);

    if(isEmpty(N)){
      N.innerHTML='<br>';
    }

    if(!L.firstChild||isEmpty(L)){
      L.innerHTML='<br>';
    }

    L.after(N);
    put(N);

    return save();
  }

  if(e.key==='Tab'){
    e.preventDefault();

    if(t==='h'||t==='p')return;

    let tt=t;
    let ll=l;

    if(t==='e'){
      tt='b';
      ll=0;
    }

    ll=e.shiftKey
      ?Math.max(0,ll-1)
      :Math.min(6,ll+1);

    setL(L,tt,ll);

    return save();
  }

  const cd=(
    r.startContainer.nodeType===1
      ?r.startContainer
      :r.startContainer.parentElement
  ).closest('.card');

  const cm=(
    r.startContainer.nodeType===1
      ?r.startContainer
      :r.startContainer.parentElement
  ).closest('.cm');

  if(
    e.key==='Backspace' &&
    r.collapsed &&
    cm &&
    !cm.textContent.replace(/\u200b/g,'')
  ){
    e.preventDefault();

    const cc=cm.parentElement;

    cm.remove();

    const q=document.createRange();

    q.selectNodeContents(cc);
    q.collapse(false);

    s.removeAllRanges();
    s.addRange(q);

    return save();
  }

  if(
    e.key==='Backspace' &&
    r.collapsed &&
    cd &&
    !cd.textContent.replace(/\u200b/g,'')
  ){
    e.preventDefault();

    const pv=cd.previousSibling;

    cd.remove();

    if(!L.firstChild){
      L.innerHTML='<br>';
    }

    if(pv&&pv.nodeType===3){
      const q=document.createRange();

      q.setStart(pv,pv.length);
      q.collapse(true);

      s.removeAllRanges();
      s.addRange(q);
    }else{
      put(L);
    }

    return save();
  }

  if(
    e.key==='Backspace' &&
    r.collapsed &&
    boundary(L,r,false)
  ){
    const p=L.previousElementSibling;
    const em=isEmpty(L);

    e.preventDefault();

    if(t==='b'&&l>0){
      setL(L,'b',l-1);
      return save();
    }

    if(t==='h'&&!em){
      setL(L,'b',0);
      return save();
    }

    if(em){
      if(
        p &&
        p.dataset.t!=='i'
      ){
        L.remove();
        put(p,true);
      }else if(
        !p &&
        t!=='e'
      ){
        setL(L,'e',0);
      }

      return save();
    }

    if(!p||p.dataset.t==='i')return;

    if(p.dataset.t==='e'){
      p.remove();
      return save();
    }

    join(p,L);
    return save();
  }

  if(
    e.key==='Delete' &&
    r.collapsed &&
    boundary(L,r,true)
  ){
    e.preventDefault();

    const n=L.nextElementSibling;

    if(!n||n.dataset.t==='i')return;

    if(isEmpty(n)){
      n.remove();
    }else if(isEmpty(L)){
      L.remove();
      put(n);
    }else{
      join(L,n);
    }

    return save();
  }
});

// Convierte  "texto <oculto<"  en tarjeta cuando se escribe el SEGUNDO "<".
// Devuelve true si modificó el DOM. El primer "<" nunca toca el DOM.
function tryCard(){
  const s=getSelection();
  if(!s.rangeCount||!s.isCollapsed)return false;
  let n=s.anchorNode,o=s.anchorOffset;
  if(!n||!ed.contains(n))return false;
  if(n.nodeType===1){ // cursor en un elemento: usar el nodo de texto contiguo
    const a=n.childNodes[o-1],b=n.childNodes[o];
    if(a&&a.nodeType===3){n=a;o=a.data.length}
    else if(b&&b.nodeType===3){n=b;o=0}
    else return false;
  }
  if(n.nodeType!==3||!n.parentElement)return false;
  if(n.parentElement.closest('.card,.cm,.cur,.im')||!n.parentElement.closest('.ln'))return false;
  let merged=false;
  while(n.previousSibling&&n.previousSibling.nodeType===3){ // texto partido por el navegador
    const p=n.previousSibling;o+=p.data.length;n.data=p.data+n.data;p.remove();merged=true;
  }
  if(merged){const r=document.createRange();r.setStart(n,o);r.collapse(true);s.removeAllRanges();s.addRange(r)}
  if(o<2||n.data[o-1]!=='<')return false;
  const start=n.data.lastIndexOf('<',o-2);
  if(start<0)return false;
  const m=n.data.slice(start+1,o-1).replace(/\u200b/g,'').match(/^(\s*)([\s\S]*?)(\s*)$/);
  if(!m[2])return false;
  const before=n.data.slice(0,start)+m[1];
  const sp=document.createElement('span');
  sp.className='card';sp.dataset.id=uid();sp.textContent=m[2];
  const tail=document.createTextNode('\u200b'+m[3]+n.data.slice(o));
  if(before){n.data=before;n.after(sp,tail)}else n.replaceWith(sp,tail);
  const r=document.createRange();r.setStart(tail,1);r.collapse(true);
  s.removeAllRanges();s.addRange(r);
  return true;
}
ed.addEventListener('compositionend',()=>{if(tryCard()){paint();save()}});
ed.addEventListener('input',(e)=>{
  norm();

  ed.querySelectorAll('.card,.cm').forEach(c=>{
    if(
      !c.textContent.replace(/\u200b/g,'') &&
      !c.contains(getSelection().anchorNode)
    ){
      c.remove();
    }
  });

  const L=curLine();

  if(!L)return save();

  if(
    L.dataset.t==='e' &&
    txt(L)
  ){
    setL(L,'b',0);
  }

  const s=getSelection();
  const n=s.anchorNode;
  const o=s.anchorOffset;

  // ----------------------------------------------------------
  // OCULTACIÓN AUTOMÁTICA:  Texto <oculto< texto
  // ----------------------------------------------------------
  if(!(e&&e.isComposing)&&tryCard()){
    paint();
    return save();
  }
  // ----------------------------------------------------------
  // COMENTARIO DE TARJETA
  // ++
  // ----------------------------------------------------------

  if(
    n &&
    n.nodeType===3 &&
    o>=2 &&
    n.data.slice(o-2,o)==='++'
  ){
    const cd=n.parentElement.closest('.card');

    if(
      cd &&
      !cd.querySelector('.cm')
    ){
      n.data=n.data.slice(0,o-2)+n.data.slice(o);

      const cm=document.createElement('span');

      cm.className='cm';
      cm.textContent='\u200b';

      cd.append(cm);

      const r=document.createRange();

      r.setStart(cm.firstChild,1);
      r.collapse(true);

      s.removeAllRanges();
      s.addRange(r);
    }
  }

  save();
});

function hideSel(){
  if(doc.type==='pdf'){
    hideSelPdf();
  }else{
    hideSelText();
  }
}

function hideSelText(){
  const s=getSelection();

  if(
    !s.rangeCount ||
    s.isCollapsed
  ){
    return toast('Selecciona primero un texto');
  }

  const r=s.getRangeAt(0);

  if(
    !ed.contains(r.commonAncestorContainer)
  ){
    return toast('Selecciona texto dentro del documento');
  }

  let n=0;

  ed.querySelectorAll('.ln').forEach(L=>{
    if(!r.intersectsNode(L))return;

    const q=document.createRange();

    q.selectNodeContents(L);

    if(
      r.compareBoundaryPoints(
        Range.START_TO_START,
        q
      )>0
    ){
      q.setStart(
        r.startContainer,
        r.startOffset
      );
    }

    if(
      r.compareBoundaryPoints(
        Range.END_TO_END,
        q
      )<0
    ){
      q.setEnd(
        r.endContainer,
        r.endOffset
      );
    }

    if(
      q.toString()
       .replace(/\u200b/g,'')
       .trim()===''
    )return;

    const a=q.commonAncestorContainer;

    if(
      (a.nodeType===1?a:a.parentElement)
      .closest('.card')
    )return;

    const f=q.extractContents();

    f.querySelectorAll('.card').forEach(c=>{
      c.replaceWith(...c.childNodes);
    });

    const sp=document.createElement('span');

    sp.className='card';
    sp.dataset.id=uid();
    sp.append(f);

    q.insertNode(sp);

    n++;
  });

  s.removeAllRanges();

  if(n){
    paint();
    flush();

    toast(
      n>1
        ?n+' tarjetas creadas'
        :'Tarjeta creada'
    );
  }
}

const PDFW=
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfW=0;

async function getBlob(id){
  let b=await pdfGet(id);

  if(
    !b &&
    sb &&
    user
  ){
    const {data}=await sb.storage
      .from('pdfs')
      .download(`${user.id}/${id}.pdf`);

    if(data){
      b=data;
      await pdfPut(id,b);
    }
  }

  return b;
}

async function loadPdf(){
  const host=$('#pages');
  const d=doc;

  host.innerHTML=
    '<p class="empty">Cargando PDF…</p>';

  if(!window.pdfjsLib){
    host.innerHTML=
      '<p class="empty">No se pudo cargar pdf.js (¿sin conexión?).</p>';
    return;
  }

  const b=await getBlob(d.id);

  if(!b){
    host.innerHTML=
      '<p class="empty">El PDF original no está disponible en este dispositivo.</p>';
    return;
  }

  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;

  let pdf;

  try{
    pdf=await pdfjsLib
      .getDocument({
        data:await b.arrayBuffer()
      })
      .promise;
  }catch(e){
    host.innerHTML=
      '<p class="empty">No se pudo abrir el PDF.</p>';
    return;
  }

  if(doc!==d)return;

  const w=
    pdfW=
      host.clientWidth||800;

  host.innerHTML='';

  const io=new IntersectionObserver(
    es=>es.forEach(en=>{
      if(
        en.isIntersecting &&
        !en.target.dataset.done
      ){
        en.target.dataset.done=1;
        drawPage(en.target);
      }
    }),
    {
      rootMargin:'900px'
    }
  );

  for(
    let p=1;
    p<=pdf.numPages;
    p++
  ){
    const page=await pdf.getPage(p);

    const vp=page.getViewport({
      scale:
        w/
        page.getViewport({scale:1}).width
    });

    if(doc!==d)return;

    const pg=document.createElement('div');

    pg.className='pg';
    pg.dataset.p=p;
    pg.style.width=vp.width+'px';
    pg.style.height=vp.height+'px';

    pg._page=page;
    pg._vp=vp;

    pg.innerHTML='<div class="ov"></div>';

    host.append(pg);
    io.observe(pg);
  }

  renderOv();
  paint();
}

async function drawPage(pg){
  const page=pg._page;
  const vp=pg._vp;

  const dpr=Math.min(
    devicePixelRatio||1,
    2
  );

  const c=document.createElement('canvas');

  c.width=vp.width*dpr;
  c.height=vp.height*dpr;

  c.style.cssText=
    'position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply';

  pg.prepend(c);

  await page.render({
    canvasContext:c.getContext('2d'),
    viewport:vp,
    transform:
      dpr!==1
        ?[dpr,0,0,dpr,0,0]
        :null
  }).promise;

  const tl=document.createElement('div');

  tl.className='textLayer';
  tl.style.setProperty(
    '--scale-factor',
    vp.scale
  );

  pg.insertBefore(
    tl,
    pg.querySelector('.ov')
  );

  pdfjsLib.renderTextLayer({
    textContentSource:
      await page.getTextContent(),
    container:tl,
    viewport:vp,
    textDivs:[]
  });
}

function mergeRects(a){
  a.sort(
    (m,n)=>
      m.p-n.p||
      m.y-n.y||
      m.x-n.x
  );

  const o=[];

  a.forEach(r=>{
    const l=o[o.length-1];

    if(
      l &&
      l.p===r.p &&
      Math.abs(
        l.y+l.h/2-
        (r.y+r.h/2)
      )<
        Math.max(l.h,r.h)*.5 &&
      r.x<=l.x+l.w+.03
    ){
      const x2=Math.max(
        l.x+l.w,
        r.x+r.w
      );

      const y1=Math.min(
        l.y,
        r.y
      );

      const y2=Math.max(
        l.y+l.h,
        r.y+r.h
      );

      l.x=Math.min(l.x,r.x);
      l.w=x2-l.x;
      l.y=y1;
      l.h=y2-y1;
    }else{
      o.push({...r});
    }
  });

  return o;
}

function hideSelPdf(){
  const s=getSelection();

  if(
    !s.rangeCount ||
    s.isCollapsed
  ){
    return toast('Selecciona primero un texto');
  }

  const r=s.getRangeAt(0);
  const rects=[];
  let text='';

  $('#pages')
    .querySelectorAll('.pg')
    .forEach(pg=>{
      const tl=pg.querySelector('.textLayer');

      if(
        !tl ||
        !r.intersectsNode(tl)
      )return;

      const pr=pg.getBoundingClientRect();

      tl.querySelectorAll('span')
        .forEach(sp=>{
          if(!r.intersectsNode(sp))return;

          const q=document.createRange();

          q.selectNodeContents(sp);

          if(
            r.compareBoundaryPoints(
              Range.START_TO_START,
              q
            )>0
          ){
            q.setStart(
              r.startContainer,
              r.startOffset
            );
          }

          if(
            r.compareBoundaryPoints(
              Range.END_TO_END,
              q
            )<0
          ){
            q.setEnd(
              r.endContainer,
              r.endOffset
            );
          }

          const t=q.toString();

          if(!t.trim())return;

          text+=t+' ';

          for(
            const b of q.getClientRects()
          ){
            if(b.width>1){
              rects.push({
                p:+pg.dataset.p,
                x:(b.left-pr.left)/pr.width,
                y:(b.top-pr.top)/pr.height,
                w:b.width/pr.width,
                h:b.height/pr.height
              });
            }
          }
        });
    });

  if(!rects.length){
    return toast('Selecciona texto del PDF');
  }

  doc.cards[uid()]={
    r:mergeRects(rects),
    t:text.trim().slice(0,200)
  };

  doc.updated=Date.now();

  persist();

  s.removeAllRanges();

  renderOv();
  paint();

  toast('Tarjeta creada');
}

function renderOv(){
  const host=$('#pages');
  host.querySelectorAll('.pc,.pi,.hb').forEach(e=>e.remove());
  Object.entries(doc.cards).forEach(([id,c])=>{
    if(c.pit||c.hd){ // posit o encabezado marcado en el PDF
      const pg=host.querySelector(`.pg[data-p="${c.p}"]`);
      if(!pg)return;
      const d=document.createElement('div');
      d.dataset.id=id;d.className=c.pit?'pi':'hb';
      if(c.hd)d.textContent=c.hd;
      d.style.cssText=c.pit?`top:${(c.y*100).toFixed(3)}%`:`left:${(c.x*100).toFixed(3)}%;top:${(c.y*100).toFixed(3)}%`;
      pg.append(d);return;
    }
    (c.r||[]).forEach(r=>{
      const ov=host.querySelector(`.pg[data-p="${r.p}"] .ov`);
      if(!ov)return;
      const d=document.createElement('div');

function addImage(f){
  if(
    !f ||
    !f.type.startsWith('image/')
  ){
    return toast('Archivo no válido');
  }

  const u=URL.createObjectURL(f);
  const im=new Image();

  im.onload=()=>{
    const k=Math.min(
      1,
      1100/im.width
    );

    const c=document.createElement('canvas');

    c.width=Math.round(im.width*k);
    c.height=Math.round(im.height*k);

    const x=c.getContext('2d');

    x.fillStyle='#fff';
    x.fillRect(
      0,
      0,
      c.width,
      c.height
    );

    x.drawImage(
      im,
      0,
      0,
      c.width,
      c.height
    );

    URL.revokeObjectURL(u);

    const L=document.createElement('div');

    L.className='ln';
    setL(L,'i',0);
    L.contentEditable='false';

    L.innerHTML=
      '<div class="im">'+
      '<img draggable="false" alt="" src="'+
      c.toDataURL('image/jpeg',.82)+
      '">'+
      '<button class="x" title="Quitar imagen">×</button>'+
      '</div>';

    let ref=curLine();

    if(!ref){
      ref=ed.lastElementChild;
    }

    if(
      ref &&
      ref.dataset.t==='e' &&
      isEmpty(ref)
    ){
      ref.replaceWith(L);
    }else if(ref){
      ref.after(L);
    }else{
      ed.append(L);
    }

    const N=mk('e',0);

    L.after(N);

    put(N);

    flush();

    toast('Imagen añadida');
  };

  im.onerror=()=>{
    toast('No se pudo leer la imagen');
  };

  im.src=u;
}

let sb=null;
let user=null;
let syncing=false;   // generación de sesión que está sincronizando (false = libre)
let pending=false;   // hay que repetir la sincronización al terminar la actual
let gen=0;           // se incrementa en cada cambio de sesión
let tm;

if(
  CFG.url &&
  CFG.key &&
  window.supabase
){
  sb=supabase.createClient(
    CFG.url,
    CFG.key
  );

  sb.auth.onAuthStateChange(
    (_e,s)=>{
      const next=s?.user||null;
      const changed=(user?.id||null)!==(next?.id||null);

      if(!changed){
        // mismo usuario (refresco de token, etc.): no reiniciar nada
        user=next;
        $('#acct').textContent=user?user.email:'Entrar';
        return;
      }

      // 1) Guardar el estado de la cuenta saliente bajo SU clave
      if(user){
        if(doc)flush();
        localStorage.setItem('sl1_'+user.id,JSON.stringify(S));
      }

      // 2) Invalidar sincronizaciones y temporizadores de la sesión anterior
      gen++;
      pending=false;
      clearTimeout(tm);
      clearTimeout(st);
      dirty=false;

      user=next;
      cur=null;
      doc=null;
      mode='edit';
      active=null;
      ed.innerHTML='';
      hideBar();
      $('#st').textContent='';

      if(user){
        const key='sl1_'+user.id;
        let saved=localStorage.getItem(key);

        // Recuperar datos antiguos una sola vez POR CUENTA
        if(localStorage.getItem('sl1_legacy_claimed')!==user.id){
          const legacy=localStorage.getItem('sl1');
          if(legacy){
            try{
              const old=JSON.parse(legacy);
              const current=saved?JSON.parse(saved):{folders:[],items:[]};
              old.folders||=[];old.items||=[];
              current.folders||=[];current.items||=[];
              old.folders.forEach(x=>{
                if(!current.folders.some(y=>y.id===x.id))current.folders.push(x);
              });
              old.items.forEach(x=>{
                if(!current.items.some(y=>y.id===x.id))current.items.push(x);
              });
              saved=JSON.stringify(current);
              localStorage.setItem(key,saved);
              localStorage.setItem('sl1_legacy_claimed',user.id);
            }catch(e){
              console.error('No se pudieron recuperar los datos antiguos:',e);
            }
          }
        }

        let loaded=null;
        try{loaded=saved?JSON.parse(saved):null}catch(e){console.error(e)}
        S=loaded||{folders:[],items:[]};
        S.folders||=[];
        S.items||=[];
        stateOwner=user.id;

        $('#acct').textContent=user.email;
        home();               // 1º pintar el estado local de la cuenta
        setTimeout(sync,0);   // 2º fusionar con Supabase
      }else{
        S={folders:[],items:[]};
        stateOwner=null;
        $('#acct').textContent='Entrar';
        home();
      }
    }
  );
}

let view='file',mapOpen=new Set(),smR=null,pdn=false,sdt,pitEl=null;
const rectOf=r=>{const rs=r.getClientRects?r.getClientRects():[];return rs[rs.length-1]||(r.getBoundingClientRect?r.getBoundingClientRect():{bottom:0,left:0})};

// Selección dentro del PDF -> rectángulos relativos a cada página
function pdfSelection(){
  const s=getSelection();
  if(!s.rangeCount||s.isCollapsed)return null;
  const r=s.getRangeAt(0),rects=[];let text='';
  $('#pages').querySelectorAll('.pg').forEach(pg=>{
    const tl=pg.querySelector('.textLayer');
    if(!tl||!r.intersectsNode(tl))return;
    const pr=pg.getBoundingClientRect();
    tl.querySelectorAll('span').forEach(sp=>{
      if(!r.intersectsNode(sp))return;
      const q=document.createRange();q.selectNodeContents(sp);
      if(r.compareBoundaryPoints(Range.START_TO_START,q)>0)q.setStart(r.startContainer,r.startOffset);
      if(r.compareBoundaryPoints(Range.END_TO_END,q)<0)q.setEnd(r.endContainer,r.endOffset);
      const t=q.toString();if(!t.trim())return;text+=t+' ';
      for(const b of q.getClientRects())if(b.width>1)rects.push({p:+pg.dataset.p,x:(b.left-pr.left)/pr.width,y:(b.top-pr.top)/pr.height,w:b.width/pr.width,h:b.height/pr.height});
    });
  });
  if(!rects.length)return null;
  rects.sort((a,b)=>a.p-b.p||a.y-b.y||a.x-b.x);
  return {rects,text:text.trim().slice(0,150)};
}

// ---- Encabezados ----
function headCmd(n){doc.type==='pdf'?headPdf(n):headText(n)}
function headPdf(n){
  const x=pdfSelection();
  if(!x)return toast('Selecciona primero un texto del PDF');
  const f=x.rects[0];
  doc.cards[uid()]={hd:n,p:f.p,x:Math.max(0,f.x-.02),y:f.y,t:x.text};
  doc.updated=Date.now();persist();getSelection().removeAllRanges();renderOv();
  toast('Encabezado '+n+' marcado');
}
function headText(n){
  const s=getSelection();
  if(!s.rangeCount||!ed.contains(s.anchorNode))return;
  const r=s.getRangeAt(0);
  let ls=[...ed.querySelectorAll('.ln')].filter(L=>{
    if(L.dataset.t==='i'||!r.intersectsNode(L))return false;
    if(r.collapsed)return true;
    if(L.contains(r.endContainer)&&!L.contains(r.startContainer)){
      const q=document.createRange();q.selectNodeContents(L);q.setEnd(r.endContainer,r.endOffset);
      if(q.toString()==='')return false; // la selección termina justo al inicio de esta línea
    }
    return true;
  });
  if(!ls.length)return;
  const same=ls.every(L=>L.dataset.t==='h'&&+L.dataset.l===n);
  ls.forEach(L=>same?setL(L,'b',0):setL(L,'h',n));
  save();
}

function addPit(){
  if(!doc||dlg.open)return;
  if(doc.type==='pdf'){
    const x=pdfSelection();
    if(!x)return toast('Selecciona primero un texto del PDF');
    const l=x.rects[x.rects.length-1],id=uid();
    doc.cards[id]={pit:1,p:l.p,x:1,y:l.y,t:''};
    doc.updated=Date.now();persist();getSelection().removeAllRanges();renderOv();
    const el=$('#pages').querySelector(`.pi[data-id="${id}"]`);
    if(el)openPit(el);
    return;
  }
  if(mode!=='edit')return;
  const s=getSelection();
  if(!s.rangeCount||!ed.contains(s.anchorNode))return toast('Selecciona primero el texto');
  const r=s.getRangeAt(0).cloneRange();r.collapse(false);
  const a=r.endContainer,ln=(a.nodeType===1?a:a.parentElement).closest('.ln');
  if(!ln||ln.dataset.t==='i')return;
  const el=document.createElement('span');
  el.className='pit';el.dataset.pid=uid();el.dataset.n='';el.contentEditable='false';
  el.style.right=`calc(-1.5em - ${ln.querySelectorAll('.pit').length*1.2}em)`;ln.append(el);s.removeAllRanges();save();openPit(el);
}

});

// ---- Desplazamiento y zoom: dedos (móvil/tablet), ratón, rueda, WASD y + / − ----
function pz(vp,inn){
  const st={x:24,y:24,k:1},P=new Map();
  let moved=false,pd=0,pm=null;
  const ap=()=>{inn.style.transform=`translate(${st.x}px,${st.y}px) scale(${st.k})`};
  st.reset=()=>{st.x=24;st.y=24;st.k=1;ap()};
  st.pan=(dx,dy)=>{st.x+=dx;st.y+=dy;ap()};
  st.zoom=(f,cx,cy)=>{
    const k=Math.max(.2,Math.min(3,st.k*f));
    if(cx==null){cx=vp.clientWidth/2;cy=vp.clientHeight/2}
    st.x=cx-(cx-st.x)*(k/st.k);st.y=cy-(cy-st.y)*(k/st.k);st.k=k;ap();
  };
  vp.addEventListener('click',e=>{if(moved){e.stopImmediatePropagation();e.preventDefault();moved=false}},true);
  vp.addEventListener('pointerdown',e=>{
    P.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
    if(P.size===1){moved=false;pd=0;pm=null}
    else if(P.size===2){ // empieza el pellizco: medir ya la distancia inicial
      const [a,b]=[...P.values()],r=vp.getBoundingClientRect();
      pd=Math.hypot(a.x-b.x,a.y-b.y);pm={x:(a.x+b.x)/2-r.left,y:(a.y+b.y)/2-r.top};
    }
  });
  vp.addEventListener('pointermove',e=>{
    const p=P.get(e.pointerId);if(!p)return;
    const px=p.x,py=p.y;p.x=e.clientX;p.y=e.clientY;
    if(P.size===1){
      if(!moved&&Math.hypot(p.x-p.sx,p.y-p.sy)<6)return;
      if(!moved){moved=true;try{vp.setPointerCapture(e.pointerId)}catch(_){}}
      st.pan(p.x-px,p.y-py);
    }else if(P.size===2){
      moved=true;
      const [a,b]=[...P.values()],r=vp.getBoundingClientRect(),
        d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;
      if(pm)st.pan(mx-pm.x,my-pm.y);
      if(pd)st.zoom(d/pd,mx,my);
      pd=d;pm={x:mx,y:my};
    }
  });
  const up=e=>{
    P.delete(e.pointerId);pd=0;pm=null;
    if(P.size===1){const q=[...P.values()][0];q.sx=q.x;q.sy=q.y}
  };
  vp.addEventListener('pointerup',up);
  vp.addEventListener('pointercancel',up);
  vp.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=vp.getBoundingClientRect();
    st.zoom(e.deltaY<0?1.1:1/1.1,e.clientX-r.left,e.clientY-r.top);
  },{passive:false});
  return st;
}
const dpz=pz($('#map'),$('#mapin')),fpz=pz($('#fmap'),$('#fmapin'));
const curPZ=()=>!$('#fview').hidden?fpz:(doc&&view==='map'&&!$('#docv').hidden?dpz:null);
document.addEventListener('keydown',e=>{
  const z=curPZ();
  if(!z||e.ctrlKey||e.metaKey||e.altKey||dlg.open)return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName||''))return;
  const k=(e.key||'').toLowerCase(),mv={w:[0,60],s:[0,-60],a:[60,0],d:[-60,0]};
  if(mv[k]){e.preventDefault();z.pan(...mv[k])}
  else if(k==='+'||k==='='){e.preventDefault();z.zoom(1.2)}
  else if(k==='-'||k==='_'){e.preventDefault();z.zoom(1/1.2)}
});

// ---- Vista mapa: los nodos siempre se ven, lo que se oculta es SU TEXTO ----
function hsOf(i){
  if(i.type==='pdf')return Object.values(i.cards||{}).filter(c=>c.hd).sort((a,b)=>a.p-b.p||a.y-b.y||a.x-b.x).map(c=>({l:c.hd,t:c.t||'(sin título)'}));
  const t=document.createElement('template');t.innerHTML=i.html||'';
  return [...t.content.querySelectorAll('.ln[data-t=h]')].map(L=>({l:+L.dataset.l,t:L.textContent.replace(/\u200b/g,'').trim()||'(sin título)'}));
}
function headingsList(){if(doc.type!=='pdf')flush();return hsOf(doc)}
function buildTree(hs){ // cada encabezado cuelga del anterior más cercano de orden menor
  const root={c:[]},st=[{l:0,n:root}];let k=0;
  hs.forEach(h=>{
    while(st[st.length-1].l>=h.l)st.pop();
    const n={l:h.l,t:h.t,c:[],k:k++};
    st[st.length-1].n.c.push(n);st.push({l:h.l,n});
  });
  return root;
}
function treeHTML(root,open,pre){
  const node=n=>`<div class="mn"><div class="mt${open.has(pre+n.k)?'':' hid'}" data-k="${pre}${n.k}">${esc(n.t)}</div>${n.c.length?`<div class="mc">${n.c.map(node).join('')}</div>`:''}</div>`;
  return `<div class="mc root">${root.c.map(node).join('')}</div>`;
}
function renderMap(){
  const root=buildTree(headingsList());
  $('#mapin').innerHTML=root.c.length?treeHTML(root,mapOpen,''):'<p class="empty">Aún no hay encabezados. Márcalos con Alt+1 … Alt+6.</p>';
}

// ============================================================
// SINCRONIZACIÓN BIDIRECCIONAL (fusión por id)
//
//  1. Descarga las filas remotas del usuario (no toca S).
//  2. Fusiona remoto -> local en un bloque SIN awaits:
//       solo remoto  -> se incorpora
//       ambos        -> gana el de `updated` mayor (empate: remoto)
//  3. Sube local -> remoto (inserta lo que falta, actualiza si local es más nuevo).
//  4. Cada await comprueba que la sesión sigue siendo la misma (gen/user);
//     si cambió, la operación se abandona sin tocar S, la UI ni localStorage.
// ============================================================

async function fetchAll(t,owner,chk){
  const out=[];
  for(let a=0;;a+=500){
    const {data,error}=await sb
      .from(t)
      .select('*')
      .eq('user_id',owner)
      .order('id')
      .range(a,a+499);
    chk();
    if(error)throw error;
    out.push(...(data||[]));
    if(!data||data.length<500)break;
  }
  return out;
}

async function sync(){
  if(!sb||!user)return;

  const g=gen;
  const owner=user.id;

  // Ya hay una sincronización de ESTA sesión: encolar otra al terminar.
  if(syncing===g){pending=true;return}
  syncing=g;
  pending=false;

  const STALE=new Error('sesión cambiada');
  const chk=()=>{
    if(g!==gen||!user||user.id!==owner)throw STALE;
  };
  const row=l=>({...l,user_id:owner,del:!!l.del});
  const clean=r=>{const {user_id,...x}=r;return x};

  $('#st').textContent='Sincronizando…';

  try{
    // ---------- 1. descargar (solo lectura) ----------
    const rf=await fetchAll('folders',owner,chk);
    const ri=await fetchAll('items',owner,chk);
    chk();

    // ---------- 2. fusionar remoto -> local (síncrono) ----------
    if(dirty&&doc)flush(); // ediciones aún no volcadas: que compitan con su fecha real
    const prev=doc?{id:doc.id,html:doc.html,updated:doc.updated}:null;
    const merge=(loc,rows)=>{
      rows.forEach(raw=>{
        const r=clean(raw);
        const i=loc.findIndex(x=>x.id===r.id);
        if(i<0)loc.push(r);
        else if((r.updated||0)>=(loc[i].updated||0))loc[i]=r;
      });
    };
    merge(S.folders,rf);
    merge(S.items,ri);

    // ---------- 3. subir local -> remoto ----------
    const remoteF=new Map(rf.map(r=>[r.id,r]));
    const remoteI=new Map(ri.map(r=>[r.id,r]));

    // Comprueba si una fila propia con ese id ya existe (carrera entre dispositivos)
    const mine=async(t,id)=>{
      const {data,error}=await sb.from(t).select('id,updated').eq('id',id).eq('user_id',owner);
      chk();
      if(error)throw error;
      return (data||[])[0]||null;
    };

    // Carpetas
    for(const id0 of S.folders.map(x=>x.id)){
      let id=id0;
      for(let a=0;a<5;a++){
        const l=S.folders.find(x=>x.id===id);
        if(!l)break;
        const r=remoteF.get(id);
        if(r){
          if((l.updated||0)>(r.updated||0)){
            const {error}=await sb.from('folders').update(row(l)).eq('id',id).eq('user_id',owner);
            chk();
            if(error)throw error;
            remoteF.set(id,{...l,user_id:owner});
          }
          break;
        }
        const {error}=await sb.from('folders').insert(row(l));
        chk();
        if(!error){remoteF.set(id,{...l,user_id:owner});break}
        if(error.code!=='23505')throw error;      // RLS u otro error: NO es colisión
        const ex=await mine('folders',id);
        if(ex){remoteF.set(id,ex);continue}       // era nuestra: actualizar en la vuelta siguiente
        // Colisión real (el id pertenece a otra cuenta): nuevo id + referencias
        const nid=uid(),now=Date.now();
        l.id=nid;l.updated=now;
        S.items.forEach(i=>{if(i.folder===id){i.folder=nid;i.updated=now}});
        if(cur===id)cur=nid;
        id=nid;
      }
    }

    // Documentos
    for(const id0 of S.items.map(x=>x.id)){
      let id=id0;
      for(let a=0;a<5;a++){
        const l=S.items.find(x=>x.id===id);
        if(!l)break;
        const r=remoteI.get(id);
        if(r){
          if((l.updated||0)>(r.updated||0)){
            const {error}=await sb.from('items').update(row(l)).eq('id',id).eq('user_id',owner);
            chk();
            if(error)throw error;
            remoteI.set(id,{...l,user_id:owner});
          }
          break;
        }
        const {error}=await sb.from('items').insert(row(l));
        chk();
        if(!error){remoteI.set(id,{...l,user_id:owner});break}
        if(error.code!=='23505')throw error;
        const ex=await mine('items',id);
        if(ex){remoteI.set(id,ex);continue}
        // Colisión real: nuevo id, conservar PDF local y reseñas
        const nid=uid();
        if(l.type==='pdf'){
          const b=await pdfGet(id);
          chk();
          if(b){await pdfPut(nid,b);chk()}
        }
        const {error:re}=await sb.from('reviews').update({item_id:nid}).eq('item_id',id).eq('user_id',owner);
        chk();
        if(re)throw re;
        l.id=nid;l.updated=Date.now();
        id=nid;
      }

      // PDF -> Storage (solo si existe el archivo local)
      const l=S.items.find(x=>x.id===id);
      if(l&&l.type==='pdf'&&!l.del){
        const flag='slpdf_'+owner+'_'+l.id;
        if(!localStorage.getItem(flag)){
          const b=await pdfGet(l.id);
          chk();
          if(b){
            const {error:pe}=await sb.storage.from('pdfs').upload(`${owner}/${l.id}.pdf`,b,{upsert:true,contentType:'application/pdf'});
            chk();
            if(pe)throw pe;
            localStorage.setItem(flag,'1');
          }
        }
      }
    }

    // ---------- 4. guardar y refrescar ----------
    chk();
    localStorage.setItem('sl1_'+owner,JSON.stringify(S));

    if(doc){
      const nd=S.items.find(i=>i.id===doc.id);
      if(!nd||nd.del){
        doc=null;
        home();
      }else{
        const replaced=nd!==doc;
        doc=nd;
        if(replaced&&prev&&(nd.html!==prev.html||nd.updated!==prev.updated)){
          if(doc.type==='pdf'){renderOv();paint()}
          else{ed.innerHTML=doc.html||'';norm();paint()}
        }
      }
    }else{
      home();
    }
    $('#st').textContent='Sincronizado';

  }catch(e){
    if(e!==STALE){
      console.error('Error de sincronización:',e);
      if(g===gen)$('#st').textContent='Error de sincronización';
    }
  }finally{
    if(syncing===g)syncing=false;
    if(pending&&g===gen&&user&&user.id===owner){
      pending=false;
      setTimeout(sync,0);
    }
  }
}

$('#acct').onclick=()=>{

  if(!sb){
    return modal(
      '<h3>Nube no configurada</h3>'+
      '<p>Rellena CFG.url y CFG.key.</p>',
      ()=>{}
    );
  }

  if(user){
    return modal(
      `<h3>${esc(user.email)}</h3>
       <button data-x="sync">Sincronizar ahora</button>
       <button data-x="out">Cerrar sesión</button>`,
      async x=>{
        dlg.close();

        if(x==='out'){
          await sb.auth.signOut();
        }else if(x==='sync'){
          sync();
        }
      }
    );
  }

  modal(
    '<h3>Cuenta</h3>'+
    '<input id="em" type="email" placeholder="Email">'+
    '<input id="pw" type="password" placeholder="Contraseña (mín. 6)">'+
    '<p id="am"></p>'+
    '<button data-x="in">Entrar</button>'+
    '<button data-x="up">Crear cuenta</button>',
    async x=>{

      const email=$('#em').value;
      const password=$('#pw').value;

      if(
        !email ||
        !password
      ){
        $('#am').textContent=
          'Introduce email y contraseña.';
        return;
      }

      const r=
        x==='in'
          ?await sb.auth.signInWithPassword({
            email,
            password
          })
          :await sb.auth.signUp({
            email,
            password,
            options:{
              emailRedirectTo:
                'https://jeprats.github.io/StudyLines/'
            }
          });

      if(r.error){

        $('#am').textContent=
          r.error.message;

      }else if(!r.data.session){

        $('#am').textContent=
          'Revisa tu correo para confirmar la cuenta.';

      }else{

        dlg.close();
      }
    }
  );
};
